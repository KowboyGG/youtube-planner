async function findChannels(q) {
  const get = async params => {
    const items = (await ytGet('channels', {part: 'snippet,statistics,contentDetails,brandingSettings', maxResults: 50, ...params})).items || [];
    const order = params.id ? params.id.split(',') : [];
    return items.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
  };
  let m;
  if ((m = q.match(/(UC[\w-]{22})/))) return get({id: m[1]});
  const handle = (q.match(/@[^\s/?#]+/) || [])[0] || (/^[\w.\-]{3,30}$/.test(q) ? '@' + q : '');
  if (handle) {
    const items = await get({forHandle: handle});
    if (items.length) return items;
  }
  const s = await ytGet('search', {part: 'snippet', type: 'channel', q, maxResults: 6});
  const ids = (s.items || []).map(it => it.id?.channelId || it.snippet?.channelId).filter(Boolean);
  return ids.length ? get({id: ids.join(',')}) : [];
}

function applyRivalChannel(c, ch) {
  const sn = ch.snippet || {}, st = ch.statistics || {};
  Object.assign(c, {title: sn.title || c.title || '', handle: sn.customUrl || c.handle || '', description: (sn.description || '').slice(0, 2000),
    avatar: sn.thumbnails?.medium?.url || sn.thumbnails?.default?.url || c.avatar || '', banner: ch.brandingSettings?.image?.bannerExternalUrl || '',
    subs: +st.subscriberCount || 0, hiddenSubs: !!st.hiddenSubscriberCount, views: +st.viewCount || 0, videoCount: +st.videoCount || 0,
    uploads: ch.contentDetails?.relatedPlaylists?.uploads || c.uploads || ''});
}

const RIVAL_YEARS = 2, RIVAL_CAP = 2000;
const KIND_NAMES = {video: 'видео', short: 'Shorts', live: 'трансляция'};
const kindOf = v => v.kind || (v.duration <= 60 ? 'short' : 'video');

// id роликов из плейлиста (он идёт от новых к старым) до даты since; null — такого плейлиста у канала нет
async function playlistIds(playlistId, since, cap) {
  const out = [];
  let page = '';
  do {
    let d;
    try { d = await ytGet('playlistItems', {part: 'contentDetails', playlistId, maxResults: 50, ...(page && {pageToken: page})}); }
    catch (e) { if (/playlist/i.test(e.message)) return null; throw e; }
    for (const it of d.items || []) {
      if (since && Date.parse(it.contentDetails.videoPublishedAt || '') < since) return out;
      out.push(it.contentDetails.videoId);
    }
    page = d.nextPageToken || '';
  } while (page && out.length < cap);
  return out;
}

// У каждого канала есть скрытые списки, из которых YouTube собирает вкладки: UULF — видео, UUSH — Shorts, UULV — трансляции.
// По ним тип ролика известен точно; null — списки недоступны, тогда тип угадываем по длительности и признакам эфира.
async function channelKinds(channelId, since, cap) {
  const base = channelId.slice(2), kinds = new Map();
  const lists = await Promise.all(['UULF', 'UUSH', 'UULV'].map(prefix => playlistIds(prefix + base, since, cap)));
  ['video', 'short', 'live'].forEach((kind, i) => (lists[i] || []).forEach(id => { if (!kinds.has(id)) kinds.set(id, kind); }));
  return lists.some(list => list !== null) ? kinds : null;
}

function toRivalVideo(it, kind, prev) {
  const dur = isoDur(it.contentDetails?.duration), broadcast = it.snippet.liveBroadcastContent;
  return {id: it.id, title: it.snippet.title, publishedAt: it.snippet.publishedAt, duration: dur,
    kind: kind || (it.liveStreamingDetails ? 'live' : dur <= 60 ? 'short' : 'video'), onAir: broadcast === 'live', upcoming: broadcast === 'upcoming',
    views: +it.statistics?.viewCount || 0, likes: +it.statistics?.likeCount || 0, comments: +it.statistics?.commentCount || 0,
    // полное описание подгружается при открытии ролика, в списке храним начало — чтобы файл не разрастался
    description: prev?.fullAt ? prev.description : (it.snippet.description || '').slice(0, 300),
    tags: prev?.fullAt ? prev.tags : (it.snippet.tags || []).slice(0, 10), ...(prev?.fullAt && {fullAt: prev.fullAt})};
}

async function refreshRival(c, ch) {
  if (!ch) ch = ((await ytGet('channels', {part: 'snippet,statistics,contentDetails,brandingSettings', id: c.id})).items || [])[0];
  if (!ch) throw new Error(`Канал «${c.title}» не найден на YouTube`);
  applyRivalChannel(c, ch);
  const since = c.fullHistory ? 0 : Date.now() - RIVAL_YEARS * 365 * 864e5;
  const kinds = await channelKinds(c.id, since, RIVAL_CAP);
  const ids = kinds ? [...kinds.keys()] : (c.uploads && await playlistIds(c.uploads, since, RIVAL_CAP)) || [];
  const prev = new Map(c.videos.map(v => [v.id, v])), videos = [];
  for (let i = 0; i < ids.length; i += 50) {
    const d = await ytGet('videos', {part: 'snippet,statistics,contentDetails,liveStreamingDetails', id: ids.slice(i, i + 50).join(',')});
    for (const it of d.items || []) videos.push(toRivalVideo(it, kinds?.get(it.id), prev.get(it.id)));
  }
  c.videos = videos.sort((a, b) => Date.parse(b.publishedAt) - Date.parse(a.publishedAt));
  c.kindsExact = !!kinds;
  c.fetchedAt = Date.now();
}

async function refreshRivalVideo(rv) {
  const it = ((await ytGet('videos', {part: 'snippet,statistics,contentDetails,liveStreamingDetails', id: rv.id})).items || [])[0];
  if (!it) return;
  Object.assign(rv, toRivalVideo(it, rv.kind), {description: (it.snippet.description || '').slice(0, 5000), tags: (it.snippet.tags || []).slice(0, 40), fullAt: Date.now()});
}

let rivalsRefreshing = false;
async function refreshRivals(force) {
  if (!secrets.ytKey || rivalsRefreshing || !state.competitors.length) return;
  rivalsRefreshing = true;
  let changed = false;
  for (const c of state.competitors) {
    // загруженные старой версией (без разбивки по типам) обновляем сразу, остальных — раз в 3 часа
    if (!force && c.kindsExact !== undefined && Date.now() - (c.fetchedAt || 0) < 3 * 3600e3) continue;
    try { await refreshRival(c); changed = true; } catch (e) { console.warn(e); }
  }
  rivalsRefreshing = false;
  if (!changed) return;
  touch();
  renderGuide();
  if (location.hash.startsWith('#/rival/')) rerender();
}

async function addRival(ch) {
  if (state.competitors.some(x => x.id === ch.id)) { location.hash = '#/rival/' + ch.id; return; }
  const c = {id: ch.id, addedAt: Date.now(), lastSeenAt: Date.now(), videos: []};
  applyRivalChannel(c, ch);
  state.competitors.push(c);
  try { await refreshRival(c, ch); } catch (e) { toast(e.message, 6000); }
  touch();
  location.hash = '#/rival/' + c.id;
}

    results.innerHTML = '<div class="muted">Ищу…</div>';
    try {
      found = await findChannels(q);
      results.innerHTML = found.length ? found.map((ch, i) => `<button type="button" class="rv-result" data-i="${i}">
          <img src="${esc(ch.snippet?.thumbnails?.default?.url || '')}" alt="" referrerpolicy="no-referrer">
          <span><b>${esc(ch.snippet?.title || '')}</b><small class="muted">${esc(ch.snippet?.customUrl || '')} ·
            ${ch.statistics?.hiddenSubscriberCount ? 'подписчики скрыты' : subsText(+ch.statistics?.subscriberCount || 0)}</small></span>
          <span class="pill white">${state.competitors.some(c => c.id === ch.id) ? 'Открыть' : '＋ Добавить'}</span></button>`).join('')
        : '<div class="muted">Ничего не нашлось — попробуй точный @никнейм или ссылку на канал</div>';
    } catch (err) { results.innerHTML = `<div class="late">${esc(err.message)}</div>`; }
  };
  form.onclick = async e => {
    if (e.target.closest('[data-d="close"]')) return close();
    const b = e.target.closest('.rv-result');
    if (!b) return;
    const ch = found[Number(b.dataset.i)];
    if (state.competitors.some(c => c.id === ch.id)) { close(); location.hash = '#/rival/' + ch.id; return; }
    b.querySelector('.pill').textContent = '⏳ Добавляю…';
    await addRival(ch);
    close();
  };
  form.q.focus();
}

const setChip = (k, v, text, on) => `<button class="chip ${on ? 'active' : ''}" data-act="set" data-k="${k}" data-v="${v}">${text}</button>`;
const moreBtn = (k, left) => left > 0 ? `<div class="more-row"><button class="pill" data-act="more" data-k="${k}">Показать ещё (осталось ${left})</button></div>` : '';

const toolHead = (title, sub) => `<div class="tool-head"><h1>${title}</h1><div class="muted">${sub}</div></div>`;
function seeded(seed) { return () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296; }
function shuffled(arr, seed) {
  const r = seeded(seed), a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

// Все ролики конкурентов одним списком (без трансляций и анонсов)
function rivalPool(kind) {
  const out = [];
  for (const c of state.competitors) for (const v of c.videos)
    if (!v.upcoming && !v.onAir && kindOf(v) !== 'live' && (!kind || kindOf(v) === kind)) out.push({c, v, x: xOf(c, v), t: Date.parse(v.publishedAt) || 0});
  return out;
}

/* ----- 💰 путь к монетизации ----- */
const YPP = {subs: 1000, hours: 4000, shorts: 10e6};
function channelPoint(c) { // замеры подписчиков — для прогноза, даже без входа в Google
  const h = c.ytHistory ||= [], p = {t: Date.now(), subs: c.yt.subs, views: c.yt.views};
  if (h.length && p.t - h[h.length - 1].t < 3600e3) h[h.length - 1] = p; else h.push(p);
  if (h.length > 600) h.splice(0, h.length - 600);
}
function subsPerDay() {

}

  let zSum = 0;

    const vals = feats.map(g => g[k]), mean = vals.reduce((a, b) => a + b, 0) / vals.length;
    const sd = Math.max(Math.sqrt(vals.reduce((a, b) => a + (b - mean) ** 2, 0) / vals.length), 1), z = (f[k] - mean) / sd;
    zSum += Math.abs(z);
    return `<tr><td>${name}</td><td>${Math.round(f[k])}</td><td>${Math.round(median(vals))}</td><td class="${Math.abs(z) >= 1 ? 'hi' : ''}">${z >= 1 ? up : z <= -1 ? down : 'как у всех'}</td></tr>`;
  });
  const score = zSum / METRICS.length + (1 - overlap) * 2;
  $('#labStand').innerHTML = `<div class="verdicts"><b>${score >= 2 ? '🟢 Выделяется в ленте' : score >= 1.2 ? '🟡 Немного отличается от ленты' : '🔴 Сливается с лентой'}</b>
      <div class="muted">Цвета совпадают с лентой на ${Math.round(overlap * 100)}%. Выделяться — не значит быть кликабельным, но в ленте похожих превью у непохожего больше шансов, что его заметят.</div></div>
    <div class="an-table-wrap"><table class="an-table"><thead><tr><th>Признак</th><th>Твоё</th><th>Лента (медиана)</th><th>Итог</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>
    <div class="loupe" style="margin-top:14px"><figure>${swatches(f.hist)}<figcaption>Твои цвета, %</figcaption></figure>
      <figure>${swatches(feedHist)}<figcaption>Цвета ленты (${plural(feats.length, ['превью', 'превью', 'превью'])}), %</figcaption></figure></div>`;
}

    case 'more': ui[d.k].show += 48; rerender(); break;
    case 'toidea': {
      if (d.vid) { const c = state.competitors.find(x => x.id === d.cid), rv = c?.videos.find(x => x.id === d.vid); if (!c || !rv) break;
        const x = xOf(c, rv);
        addIdea('yt:' + rv.id, kindOf(rv), rv.title, `Вдохновение: «${rv.title}» — ${c.title}${x ? ` (${xText(x)} к медиане канала)` : ''}, ${viewsText(rv.views)}\nhttps://youtu.be/${rv.id}`); }
      else if (d.rid) { const o = state.radar.results.find(x => x.id === d.rid); if (!o) break;
        addIdea('yt:' + o.id, o.dur <= 60 ? 'short' : 'video', o.title, `Вдохновение: «${o.title}» — ${o.ch}${o.subs == null ? '' : `, ${subsText(o.subs)}`}, ${viewsText(o.views)}\nhttps://youtu.be/${o.id}`); }
      else if (d.ask != null) { const it = state.asks.items[Number(d.ask)]; if (!it) break;
        addIdea(`c:${it.vid}:${it.at}`, 'video', it.text, `Запрос зрителя (👍 ${it.likes}) под «${it.title}»${it.ch ? ' — ' + it.ch : ''}:\n${it.text}\nhttps://youtu.be/${it.vid}`); }
      el.outerHTML = '<span class="pill idea-on">✓ В идеях</span>';
      break;
    }
    case 'radarrun': runRadar(el); break;
    case 'radardel': state.radar.queries = state.radar.queries.filter(q => q !== d.q); touch(); rerender(); break;
    case 'radardays': state.radar.days = Number(d.v); touch(); rerender(); break;
    case 'radarrival': {
      busy(el, true, '⏳ Добавляю…');
      try {
        const ch = radarChannels[d.cid] || ((await ytGet('channels', {part: 'snippet,statistics,contentDetails,brandingSettings', id: d.cid})).items || [])[0];
        if (!ch) throw new Error('Канал не найден');

      } catch (err) { toast(err.message, 6000); busy(el, false); }
      break;
    }
    case 'asksload': loadAsks(el); break;
    case 'gamepick': {
      const g = ui.game, s = state.game;
      if (!g?.pair || g.pick != null) break;
      g.pick = Number(d.i);
      const win = g.pair[g.pick].v.views >= g.pair[1 - g.pick].v.views;
      s.played++;
      if (win) { s.correct++; s.streak++; s.best = Math.max(s.best, s.streak); } else s.streak = 0;
      touch();
      rerender();
      break;
    }
    case 'gamenext': ui.game.pair = null; rerender(); break;
    case 'labshuffle': ui.lab.seed++; rerender(); break;
    case 'labfind': document.querySelector('.lf-me')?.classList.add('flash'); setTimeout(() => document.querySelector('.lf-me')?.classList.remove('flash'), 1500); break;
    case 'labimg': {

      rerender();

      break;
    }

  }

async function importJson() {

    if (/<html/i.test(raw)) raw = new DOMParser().parseFromString(raw, 'text/html').getElementById('planner-data')?.textContent || 'null';

    if (!data || !Array.isArray(data.videos)) throw new Error('это не копия планера');
    if (!confirm(`Заменить текущие данные копией (${data.videos.length} видео)?`)) return false;

}

      break;
    case 'menu':
      if (menuAnchor === el) { closeMenus(); break; }
      videoMenu(el, state.videos.find(x => x.id === el.dataset.id));
      break;
    case 'create': newVideo('video'); break;
    case 'new': newVideo(el.dataset.type); break;
    case 'ytsync': syncYouTube(el); break;
    case 'ytone': refreshOne(v || state.videos.find(x => x.id === el.dataset.id), el); break;
    case 'calnav': {
      const dir = Number(el.dataset.dir), [yy, mm] = (ui.calMonth || todayIso().slice(0, 7)).split('-').map(Number);
      ui.calMonth = dir ? isoOf(new Date(yy, mm - 1 + dir, 1)).slice(0, 7) : todayIso().slice(0, 7);
      renderTab();
      break;
    }
    case 'anperiod':
      ui.anPeriod = Number(el.dataset.days);
      renderTab(); // страница одного видео подгружает статистику за новый период сама
      if (!ui.anVideo && googleConnected() && state.analytics?.days !== ui.anPeriod) loadAnalytics(null);
      break;
    case 'anvideo': location.hash = '#/analytics/' + el.dataset.id; break;
    case 'anvload': loadVideoAnalytics(state.videos.find(x => x.id === el.dataset.id), el); break;
    case 'anload': loadAnalytics(el); break;
    case 'ansort': {
      const k = el.dataset.key, cur = ui.anSort || {key: 'published', dir: -1};
      ui.anSort = {key: k, dir: cur.key === k ? -cur.dir : k === 'title' ? 1 : -1};
      renderTab();
      break;
    }
    case 'copychat': {
      const tv = v || state.videos.find(x => x.id === el.dataset.id), q = ($('#aiQ')?.value || '').trim(), channel = el.dataset.kind === 'channel';
      copyForChat(el, async () => channel ? channelPrompt(q)
        : videoPrompt(tv, tv.yt && secrets.ytKey && $('#aiComments')?.checked !== false ? await ytTopComments(tv.yt.id) : [], q),
        !channel && tv.thumb ? '. Превью приложи кнопкой «🖼 Превью»' : '');
      break;
    }
    case 'copythumb': {
      const src = el.dataset.src || (v || state.videos.find(x => x.id === el.dataset.id))?.thumb;
      if (!src) { toast('У видео пока нет превью'); break; }
      copyImage(src).then(() => toast('🖼 Превью скопировано — вставь в чат через Ctrl+V'),
        err => toast('Не получилось скопировать картинку: ' + err.message, 6000));
      break;
    }
    case 'pasteai': {
      const box = $('#aiPaste');
      box.hidden = !box.hidden;
      if (!box.hidden) $('#aiPasteText').focus();
      break;
    }
    case 'saveai': {
      const text = $('#aiPasteText').value.trim(), tv = v || state.videos.find(x => x.id === el.dataset.id);
      if (!text) { toast('Сначала вставь ответ из чата'); break; }
      const rec = {text, at: Date.now(), model: 'ответ из чата', question: ($('#aiQ')?.value || '').trim()};
      if (el.dataset.kind === 'channel') { state.ai = rec; touch(); } else { tv.ai = rec; touch(tv); }
      rerender();
      toast('✓ Ответ сохранён');
      break;
    }
    case 'rivaladd': openAddRival(); break;
    case 'rivalvideo': location.hash = `#/rival/${el.dataset.cid}/${el.dataset.vid}`; break;
    case 'rivalfilter': ui.rivalFilter = el.dataset.f; ui.rivalShow = 60; rerender(); break;
    case 'rivalmore': ui.rivalShow += 60; rerender(); break;
    case 'rivalall': {
      const c = state.competitors.find(x => x.id === el.dataset.cid);
      c.fullHistory = true;
      busy(el, true, '⏳ Загружаю всю историю…');
      try { await refreshRival(c); touch(); rerender(); toast(`✓ Загружено ${plural(c.videos.length, ['ролик', 'ролика', 'роликов'])}`); }
      catch (err) { toast(err.message, 6000); busy(el, false); }
      break;
    }
    case 'rivalcopy': {
      const c = state.competitors.find(x => x.id === el.dataset.cid), rv = el.dataset.vid && c?.videos.find(x => x.id === el.dataset.vid);
      if (c) copyForChat(el, async () => {
        if (!rv) return rivalChannelPrompt(c);
        if (!rv.fullAt) await refreshRivalVideo(rv).catch(() => {});
        return rivalVideoPrompt(c, rv, secrets.ytKey ? await ytTopComments(rv.id) : []);
      },
        rv ? '. Превью приложи кнопкой «🖼 Превью»' : '');
      break;
    }
    case 'rivalrefresh': {
      const c = state.competitors.find(x => x.id === el.dataset.cid);
      busy(el, true, '⏳ Обновляю…');
      try { await refreshRival(c); touch(); rerender(); toast('✓ Канал обновлён'); }
      catch (err) { toast(err.message, 6000); busy(el, false); }
      break;
    }
    case 'rivaldel': {
      const c = state.competitors.find(x => x.id === el.dataset.cid);
      if (!c || !confirm(`Убрать «${c.title}» из конкурентов?`)) break;
      state.competitors = state.competitors.filter(x => x !== c);
      touch();
      location.hash = '#/home';
      break;
    }
    case 'cmmore': busy(el, true, '⏳ Загружаю…'); loadComments(el.dataset.yt, true); break;
    case 'guide': {
      const overlay = innerWidth < 1100 || !document.body.classList.contains('with-guide');
      document.body.classList.toggle(overlay ? 'guide-open' : 'guide-hidden');
      break;
    }
    case 'ai': runAi(el.dataset.kind, v || state.videos.find(x => x.id === el.dataset.id), el); break;
    case 'autodl': {
      const left = v.stages.filter(s => !s.done);
      if (!left.length) { toast('Все этапы уже готовы'); break; }
      if (!v.deadline) { toast('Сначала поставь дедлайн всего видео — поле 📅 под названием', 5000); $('#wDeadline')?.focus(); break; }
      const today = todayIso(), total = daysBetween(today, v.deadline);
      if (total < 0) { toast('Дедлайн видео уже прошёл — сначала сдвинь его'); break; }
      if (left.some(s => s.deadline) && !confirm('У некоторых этапов уже есть дедлайны. Перезаписать?')) break;
      left.forEach((s, i) => { s.deadline = isoPlus(today, Math.round(total * (i + 1) / left.length)); });
      touch(v);
      rerender();
      toast('✓ Дедлайны этапов расставлены до ' + fmtDate(v.deadline));
      break;
    }
    case 'filter': ui.filter = el.dataset.f; renderTab(); break;
    case 'save': clearTimeout(fileTimer); saveToFile(true); break;
    case 'settings': openSettings(); break;
    case 'avatar': case 'banner': changeImage(act); break;
    case 'thumb': {
      const f = await pickFile('image/*');
      if (f) setThumbFromFile(v, f);
      break;
    }
    case 'rmthumb': v.thumb = ''; touch(v); rerender(); break;
    case 'type': v.type = el.dataset.type; touch(v); rerender(); break;
    case 'stage': curStage[v.id] = el.dataset.sid; rerender(); break;
    case 'toggle': {
      const s = v.stages.find(x => x.id === el.dataset.sid), before = progress(v);
      s.done = !s.done;
      s.pct = s.done ? 100 : 0;
      touch(v);
      rerender();
      if (progress(v) === 100 && before < 100) toast('🎉 Видео готово на 100%!');
      break;
    }
    case 'stpct': {
      const s = curSt(v), before = progress(v), p = Number(el.dataset.p);
      if (!s) break;
      s.pct = p;
      s.done = p === 100;
      touch(v);
      rerender();
      if (progress(v) === 100 && before < 100) toast('🎉 Видео готово на 100%!');
      break;
    }
    case 'move': {
      const i = v.stages.findIndex(x => x.id === curStage[v.id]), j = i + Number(el.dataset.dir);
      if (i < 0 || j < 0 || j >= v.stages.length) break;
      [v.stages[i], v.stages[j]] = [v.stages[j], v.stages[i]];
      touch(v);
      rerender();
      break;
    }
    case 'delstage': {
      const s = curSt(v);
      if (!s || ((stageText(s) || s.done) && !confirm(`Удалить этап «${s.name}» вместе с заметками?`))) break;
      v.stages = v.stages.filter(x => x !== s);
      delete curStage[v.id];
      touch(v);
      rerender();
      break;
    }
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'search') {
    ui.q = t.value.trim().toLowerCase();
    if (getVideo()) location.hash = '#/videos'; else renderTab();
    return;
  }
  const v = getVideo();
  if (!v) return;
  if (t.matches('textarea.auto')) autosize(t);
  const s = curSt(v);
  const item = s && document.querySelector(`.pl-item[data-sid="${s.id}"]`);
  switch (t.id) {
    case 'wTitle':
      v.title = t.value;
      $('#plSub').textContent = (v.title || 'Без названия') + ' • ' + v.stages.filter(x => x.done).length + '/' + v.stages.length;
      document.title = (v.title || 'Без названия') + ' — ' + state.channel.name;
      break;
    case 'wNotes': v.notes = t.value; break;
    case 'wLink': v.link = t.value; break;
    case 'stName':
      s.name = t.value;
      item.querySelector('b').textContent = (v.stages.indexOf(s) + 1) + '. ' + (s.name || 'Этап');
      item.querySelector('.pl-ico').textContent = $('#edIco').textContent = stageIcon(s.name);
      break;
    case 'stNotes':
      return saveRt();
    default: return;
  }
  touch(v);
});

document.addEventListener('change', e => {
  const t = e.target, v = getVideo();
  if (t.id === 'sort') { ui.sort = t.value; renderTab(); }
  if (t.id === 'rivalSort') { ui.rivalSort = t.value; rerender(); }
  if (t.id === 'cmOrder') loadComments(t.closest('#cmBox').dataset.yt, false);
  if (t.id === 'wDeadline' && v) { v.deadline = t.value; touch(v); rerender(); }
  if (t.id === 'stDeadline' && v && curSt(v)) { curSt(v).deadline = t.value; touch(v); rerender(); }
  if (t.id === 'wLink' && v) {
    const id = ytIdFrom(v.link);
    if (v.yt && v.yt.id !== id) { v.yt = null; v.ytHistory = []; touch(v); }
    if (id && !v.yt && secrets.ytKey) refreshOne(v, null);
    else if (!!(id || v.yt) !== !!$('.yt-box')) rerender();
  }
});

document.addEventListener('submit', e => {
  if (e.target.id !== 'addStage') return;
  e.preventDefault();
  const v = getVideo(), name = e.target.elements.n.value.trim();
  if (!v || !name) return;
  const s = {id: uid(), name, done: false, notes: '', deadline: '', pct: 0, rich: true};
  v.stages.push(s);
  curStage[v.id] = s.id;
  touch(v);
  rerender();
  $('#addStage input')?.focus();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'aiQ') { $('[data-act="ai"]')?.click(); return; }
  if (e.ctrlKey && e.altKey && document.activeElement?.id === 'stNotes' && /^Digit[123]$/.test(e.code)) {
    e.preventDefault();
    return applyRt(RT_BLOCKS[Number(e.code.slice(-1)) - 1]);
  }
  if ((e.ctrlKey || e.metaKey) && e.code === 'KeyS') {
    e.preventDefault();
    clearTimeout(fileTimer);
    saveToFile(true);
    return;
  }
  if (e.key !== 'Escape') return;
  if (document.querySelector('.menu')) return closeMenus();
  const ov = document.querySelector('.overlay');
  if (ov) return ov.remove();
  if (getVideo() && !/INPUT|TEXTAREA/.test(document.activeElement.tagName) && !document.activeElement.isContentEditable) location.hash = lastChannelHash;
});

document.addEventListener('paste', e => {
  if ($('#stNotes')?.contains(e.target)) {
    // в редактор вставляем без чужих стилей и картинок, но с жирным, курсивом, списками и заголовками
    e.preventDefault();
    const html = e.clipboardData.getData('text/html'), text = e.clipboardData.getData('text/plain');
    if (html) document.execCommand('insertHTML', false, cleanRich(html));
    else if (text) document.execCommand('insertText', false, text);
    return saveRt();
  }
  const v = getVideo();
  const f = [...(e.clipboardData?.files || [])].find(x => x.type.startsWith('image/'));
  if (!v || !f) return;
  e.preventDefault();
  setThumbFromFile(v, f);
});

// перетаскивание картинки на превью; вне превью браузер не должен открывать файл
window.addEventListener('dragover', e => {
  e.preventDefault();
  document.querySelector('.player')?.classList.toggle('drag', !!e.target.closest?.('.player'));
});
window.addEventListener('dragleave', e => { if (!e.relatedTarget) document.querySelector('.player')?.classList.remove('drag'); });
window.addEventListener('drop', e => {
  e.preventDefault();
  const p = e.target.closest?.('.player'), v = getVideo();
  document.querySelector('.player')?.classList.remove('drag');
  if (p && v && e.dataTransfer.files[0]) setThumbFromFile(v, e.dataTransfer.files[0]);
});

// панель форматирования: не забираем фокус у редактора, чтобы выделение не пропадало
document.addEventListener('mousedown', e => { if (e.target.closest?.('[data-rt]')) e.preventDefault(); });
document.addEventListener('click', e => {
  const b = e.target.closest?.('[data-rt]');
  if (b) applyRt(b.dataset.rt);
});
document.addEventListener('selectionchange', updateRtBar);
document.execCommand('defaultParagraphSeparator', false, 'p');

// перенос дедлайнов в календаре перетаскиванием
let dragItem = null;
document.addEventListener('dragstart', e => {
  const it = e.target.closest?.('[data-drag]');
  if (!it) return;
  dragItem = it.dataset.drag;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragItem);
});
document.addEventListener('dragend', () => {
  dragItem = null;
  document.querySelectorAll('.cal-day.drop').forEach(d => d.classList.remove('drop'));
});
document.addEventListener('dragover', e => {
  if (!dragItem) return;
  const day = e.target.closest?.('.cal-day');
  document.querySelectorAll('.cal-day.drop').forEach(d => d !== day && d.classList.remove('drop'));
  if (day) { e.preventDefault(); day.classList.add('drop'); }
});
document.addEventListener('drop', e => {
  if (!dragItem) return;
  const day = e.target.closest?.('.cal-day'), [vid, sid] = dragItem.split('|');
  dragItem = null;
  if (!day) return;
  e.preventDefault();
  const v = state.videos.find(x => x.id === vid), target = v && (sid ? v.stages.find(s => s.id === sid) : v);
  if (!target || target.deadline === day.dataset.date) return renderTab();
  target.deadline = day.dataset.date;
  touch(v);
  renderTab();
  toast('Дедлайн перенесён на ' + fmtDate(day.dataset.date));
});

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (state && ui.tab === 'analytics' && !getVideo()) drawCharts(); }, 150);
});

window.addEventListener('hashchange', () => {
  route();
  window.scrollTo(0, 0);
});
window.addEventListener('pagehide', () => { if (state) idbSet(DB_KEY, state); });
window.addEventListener('beforeunload', e => {
  if (sessionEdits && dirty) { e.preventDefault(); e.returnValue = ''; }
});

/* ================= запуск ================= */
function renderNoServer() {
  document.title = 'YouTube-планер';
  document.querySelector('.top-right').hidden = true;
  app.innerHTML = `<div class="empty" style="padding-top:120px"><div class="big">🚀</div>
    <h3>Открой планер через «Запустить планер.bat»</h3>
    <div>Данные лежат в папке <b>data</b> рядом с планером, и читает их только запускатор.<br>
      Закрой эту вкладку и дважды щёлкни по «Запустить планер.bat».</div></div>`;
}

async function init() {
  if (location.protocol.startsWith('http')) {
    try {
      const r = await fetch('/api/ping', {headers: {'x-planer': '1'}, cache: 'no-store'});
      const info = r.ok ? await r.json() : {};
      serverMode = info.app === 'youtube-planer';
      if (serverMode && info.version < 5) setTimeout(() => toast('Перезапусти запускатор: закрой чёрное окно «Запустить планер» и открой его снова — так включится его новая версия', 12000), 1500);
      checkAppVersion(info.appVersion);
    } catch (e) {}
  }
  if (!serverMode) return renderNoServer();
  try {
    const sec = (await idbGet(SECRETS_KEY)) || {};
    secrets = {...secrets, ...sec, keys: {...secrets.keys, ...sec.keys}, models: {...secrets.models, ...sec.models}};
  } catch (e) {}
  let remote = null, legacy = false, loaded = false;
  try {
    const r = await fetch('/api/data', {headers: {'x-planer': '1'}, cache: 'no-store'});
    const d = await r.json();
    if (!r.ok) throw new Error(d.error?.message || 'ошибка ' + r.status);
    remote = d.data;
    legacy = !!d.legacy;
    loaded = true;
  } catch (e) {
    toast('Не удалось прочитать data/planer.json: ' + e.message + '. Сохранение выключено, чтобы ничего не затереть.', 15000);
  }
  const cached = await idbGet(DB_KEY);
  if (cached && (!remote || (cached.updatedAt || 0) > (remote.updatedAt || 0))) {
    state = normalize(cached); // в браузере остались изменения, которые не успели записаться
    dirty = true;
  } else if (remote) {
    state = normalize(remote);
    dirty = legacy; // данные из старого HTML сразу раскладываем по файлам
  } else {
    sampleState();
    dirty = true;
  }
  canAutoFile = loaded;
  renderTopAvatar();
  updateStatus();
  route();
  if (dirty && canAutoFile) saveToFile(false);
  refreshRivals(false);
  autoSyncYouTube();
}
init();
setInterval(() => { if (state) { refreshRivals(false); autoSyncYouTube(); } }, 30 * 60e3); // новые видео и свежие цифры, пока планер открыт
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мой канал — планер видео</title>
<style>
:root{
  --bg:#0f0f0f; --bg2:#212121; --bg3:#272727; --bg4:#3f3f3f;
  --text:#f1f1f1; --text2:#aaaaaa; --line:rgba(255,255,255,.1);
  --red:#ff0033; --green:#2ba640; --blue:#3ea6ff; --yellow:#f9c440;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Roboto,"Segoe UI",Arial,sans-serif;font-size:14px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
[hidden]{display:none!important}
a{color:var(--blue);text-decoration:none}
svg{display:block}

/* ---------- верхняя панель ---------- */
.topbar{position:sticky;top:0;z-index:50;height:56px;display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--bg)}
.logo{display:flex;align-items:center;gap:6px;font-size:20px;font-weight:700;letter-spacing:-.6px;cursor:pointer;user-select:none;white-space:nowrap}
.logo sup{font-size:10px;color:var(--text2);font-weight:400;letter-spacing:0}
.search{flex:1;display:flex;justify-content:center;min-width:0}
.search-box{display:flex;width:100%;max-width:600px}
.search-box input{flex:1;min-width:0;height:40px;background:#121212;border:1px solid #303030;border-right:0;border-radius:40px 0 0 40px;padding:0 16px;outline:none}
.search-box input:focus{border-color:#1c62b9}
.search-box span{width:64px;height:40px;background:#222;border:1px solid #303030;border-radius:0 40px 40px 0;display:grid;place-items:center}
.top-right{display:flex;align-items:center;gap:8px}
.save-status{font-size:12px;color:var(--text2);white-space:nowrap}
.save-status.dirty{color:var(--yellow)}
.save-status.ok{color:#7bd88f}
.pill{height:36px;padding:0 16px;border-radius:18px;background:var(--bg3);display:inline-flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap}
.pill:hover{background:var(--bg4)}
.pill.white{background:#f1f1f1;color:#0f0f0f}
.pill.white:hover{background:#d9d9d9}
.pill.attn{background:#263850;color:#8cc8ff}
.pill.attn:hover{background:#2f4666}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:18px}
.icon-btn:hover{background:var(--bg3)}
.avatar{border-radius:50%;background:#7e57c2 center/cover no-repeat;display:grid;place-items:center;font-weight:500;color:#fff;flex:none;overflow:hidden;user-select:none}

/* ---------- меню и диалоги ---------- */
.menu{position:absolute;background:var(--bg2);border-radius:12px;padding:8px 0;min-width:220px;box-shadow:0 4px 32px rgba(0,0,0,.6);z-index:120}
.menu button{display:flex;width:100%;align-items:center;gap:14px;padding:0 16px;height:40px;text-align:left}
.menu button:hover{background:var(--bg4)}
.menu button.danger{color:#ff7a7a}
.menu hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:grid;place-items:center;padding:16px}
.dialog{background:var(--bg2);border-radius:12px;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:24px}
.dialog h2{margin:0 0 8px;font-size:20px}
.dialog label{display:block;color:var(--text2);font-size:12px;margin:16px 0 6px}
.dialog input[type=text],.dialog textarea{width:100%;background:var(--bg);border:1px solid #303030;border-radius:8px;padding:10px 12px;outline:none}
.dialog input[type=text]:focus,.dialog textarea:focus{border-color:#1c62b9}
.dialog textarea{min-height:110px;resize:vertical;line-height:1.5}
.dlg-row{display:flex;gap:8px;flex-wrap:wrap}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}
.toast{position:fixed;left:24px;bottom:24px;max-width:calc(100vw - 48px);background:#f1f1f1;color:#0f0f0f;padding:12px 16px;border-radius:8px;z-index:300;box-shadow:0 4px 24px rgba(0,0,0,.5);transform:translateY(160%);transition:transform .25s}
.toast.show{transform:none}

/* ---------- страница канала ---------- */
.page{max-width:1284px;margin:0 auto;padding:0 24px 64px}
.banner{margin-top:4px;aspect-ratio:6.2/1;border-radius:16px;background:linear-gradient(120deg,#3a1c71,#d76d77 55%,#ffaf7b) center/cover no-repeat;position:relative;overflow:hidden}
.banner .pill{position:absolute;right:12px;bottom:12px;opacity:0;transition:opacity .2s;background:rgba(0,0,0,.65)}
.banner:hover .pill{opacity:1}
.ch-head{display:flex;gap:24px;align-items:center;padding:24px 0 8px}
.ch-head .avatar{width:160px;height:160px;font-size:64px;cursor:pointer}
.ch-info{min-width:0}
.ch-info h1{margin:0;font-size:36px;font-weight:700;line-height:1.2;word-break:break-word}
.ch-meta{color:var(--text2);margin:8px 0 6px}
.ch-meta b{color:var(--text);font-weight:500}
.ch-desc{color:var(--text2);max-width:680px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.ch-desc:hover{color:var(--text)}
.ch-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.hint{display:flex;gap:12px;align-items:center;background:#1b2a3a;border:1px solid #2c4a6b;color:#cfe6ff;border-radius:12px;padding:12px 16px;margin:16px 0 0}
.hint div{flex:1}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-top:12px;overflow-x:auto}
.tab{height:48px;display:flex;align-items:center;font-size:16px;font-weight:500;color:var(--text2);border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-color:var(--text)}
.chips{display:flex;gap:12px;margin:16px 0 24px;flex-wrap:wrap;align-items:center}
.chip{height:32px;padding:0 12px;border-radius:8px;background:var(--bg3);font-weight:500}
.chip:hover{background:var(--bg4)}
.chip.active{background:#f1f1f1;color:#0f0f0f}
.chip .cnt{opacity:.6;margin-left:4px}
.chips select{margin-left:auto;height:32px;background:var(--bg3);border:0;border-radius:8px;padding:0 8px;color-scheme:dark;cursor:pointer}

/* ---------- карточки видео ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:40px 16px}
.grid.shorts{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:28px 10px}
.card{cursor:pointer;position:relative;min-width:0}
.thumb{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--bg3) center/cover no-repeat;transition:border-radius .2s}
.card:hover .thumb{border-radius:4px}
.shorts .thumb{aspect-ratio:9/16}
.ph{position:absolute;inset:0;display:flex;align-items:flex-end;padding:14px 14px 22px;font-weight:900;line-height:1.05;text-transform:uppercase;text-shadow:0 2px 12px rgba(0,0,0,.35);word-break:break-word;overflow:hidden}
.badge{position:absolute;right:8px;bottom:12px;background:rgba(0,0,0,.8);font-size:12px;font-weight:500;padding:3px 5px;border-radius:4px;line-height:1.2}
.badge.done{background:var(--green)}
.badge.type{left:8px;right:auto;top:8px;bottom:auto}
.pbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.35)}
.pbar i{display:block;height:100%;background:var(--red)}
.card-body{display:flex;gap:4px;padding-top:12px}
.card-text{flex:1;min-width:0}
.card-title{font-size:16px;font-weight:500;line-height:22px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0 0 4px;word-break:break-word}
.card-meta{color:var(--text2);line-height:20px}
.late{color:#ff7a7a}
.card .more{width:32px;height:32px;margin-right:-8px;opacity:0}
.card:hover .more,.card .more:focus{opacity:1}
.empty{text-align:center;color:var(--text2);padding:72px 16px}
.empty .big{font-size:56px;margin-bottom:12px}
.empty h3{color:var(--text);font-size:20px;margin:0 0 8px}
.empty .pill{margin-top:16px}

/* ---------- главная вкладка ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}
.stat{background:var(--bg2);border-radius:12px;padding:16px}
.stat b{font-size:28px;display:block;margin-bottom:2px}
.stat span{color:var(--text2)}
.featured{display:flex;gap:24px;padding-bottom:24px;border-bottom:1px solid var(--line);cursor:pointer}
.featured .thumb{width:424px;flex:none}
.featured h3{font-size:18px;margin:0 0 6px;word-break:break-word}
.featured p{color:var(--text2);white-space:pre-wrap;margin:12px 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.step{font-size:12px;padding:4px 10px;border-radius:12px;background:var(--bg3);color:var(--text2)}
.step.on{background:rgba(43,166,64,.18);color:#7bd88f}
.shelf h2{font-size:20px;margin:32px 0 16px;display:flex;align-items:center;gap:10px}
.shelf h2 small{font-size:14px;color:var(--text2);font-weight:400}

/* ---------- страница видео (как просмотр) ---------- */
.watch{display:grid;grid-template-columns:minmax(0,1fr) 402px;gap:24px;max-width:1720px;margin:0 auto;padding:16px 24px 64px}
.player{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;cursor:pointer}
.player img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.player .ph{font-size:clamp(22px,4vw,56px);padding:32px 32px 44px}
.player.vertical .ph{left:34.18%;right:34.18%;font-size:clamp(16px,2vw,28px);padding:20px 16px 32px}
.player-hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);padding:10px 16px;border-radius:20px;opacity:0;transition:opacity .2s;white-space:nowrap;pointer-events:none}
.player:hover .player-hint,.player.drag .player-hint{opacity:1}
.player.drag{outline:3px dashed var(--blue);outline-offset:-3px}
.player .rm{position:absolute;right:12px;top:12px;opacity:0;background:rgba(0,0,0,.7)}
.player:hover .rm{opacity:1}
.player .pbar{height:5px}
.w-title{width:100%;background:none;border:0;border-bottom:1px solid transparent;outline:none;font-size:20px;font-weight:700;margin-top:12px;padding:4px 0}
.w-title:hover{border-color:var(--line)}
.w-title:focus{border-color:var(--blue)}
.w-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.w-ch{display:flex;align-items:center;gap:12px;margin-right:auto;cursor:pointer}
.w-ch .avatar{width:40px;height:40px;font-size:18px}
.w-ch b{display:block;font-size:16px;font-weight:500}
.w-ch small{color:var(--text2);font-size:12px}
.seg{display:flex;background:var(--bg3);border-radius:18px;overflow:hidden}
.seg button{height:36px;padding:0 14px;font-weight:500}
.seg button:hover{background:var(--bg4)}
.seg button.on{background:#f1f1f1;color:#0f0f0f}
.pill input[type=date]{background:none;border:0;outline:none;color-scheme:dark;width:128px}
.desc{background:var(--bg3);border-radius:12px;padding:12px;margin-top:12px}
.desc-top{font-weight:500;margin-bottom:6px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.desc-top .pct{color:#fff;background:var(--red);padding:1px 8px;border-radius:10px}
.desc-top .pct.done{background:var(--green)}
textarea.auto{display:block;width:100%;background:transparent;border:0;outline:none;resize:none;line-height:20px;min-height:40px;overflow:hidden}
.link-row{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.link-row input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--blue)}
.editor{margin-top:24px}
.editor-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.editor-head .ico{font-size:24px}
.editor-head{flex-wrap:wrap}
.editor-head #stName{min-width:160px}
.editor-head > input{flex:1;min-width:0;font-size:20px;font-weight:700;background:none;border:0;border-bottom:1px solid var(--line);outline:none;padding:6px 0}
.editor-head > input:focus{border-color:var(--blue)}
.editor textarea{display:block;width:100%;min-height:340px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px;line-height:1.6;font-size:15px;resize:vertical;outline:none}
.editor textarea:focus{border-color:#555}
.ed-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;color:var(--text2);flex-wrap:wrap}

.playlist{background:var(--bg2);border:1px solid var(--line);border-radius:12px;overflow:hidden;align-self:start;position:sticky;top:72px;max-height:calc(100vh - 88px);display:flex;flex-direction:column}
.pl-head{padding:14px 16px 12px;background:#2a2a2a}
.pl-head h3{margin:0 0 4px;font-size:20px}
.pl-head .sub{color:var(--text2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-bar{height:4px;background:rgba(255,255,255,.15);border-radius:2px;margin-top:10px;overflow:hidden}
.pl-bar i{display:block;height:100%;background:var(--red);transition:width .3s}
.pl-list{overflow:auto;padding:8px 0;flex:1}
.pl-item{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 10px;cursor:pointer}
.pl-item:hover{background:var(--bg3)}
.pl-item.active{background:#3a3a3a}
.pl-thumb{width:96px;height:54px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:24px;position:relative;background:linear-gradient(135deg,#3a3a3a,#1c1c1c)}
.pl-thumb.done::after{content:"✓";position:absolute;inset:0;background:rgba(43,166,64,.8);display:grid;place-items:center;font-size:26px;font-weight:700;border-radius:8px}
.pl-text{flex:1;min-width:0}
.pl-text b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-text small{display:block;color:var(--text2);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.check{width:24px;height:24px;border-radius:6px;border:2px solid #777;flex:none;display:grid;place-items:center;transition:background .15s}
.check:hover{border-color:#bbb}
.check.on{background:var(--red);border-color:var(--red)}
.check.on::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translate(0,-1px) rotate(45deg)}
.pl-add{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.pl-add input{flex:1;min-width:0;background:var(--bg);border:1px solid #303030;border-radius:18px;height:36px;padding:0 14px;outline:none}
.pl-add input:focus{border-color:#1c62b9}

/* ---------- YouTube-статистика и ИИ ---------- */
.muted{color:var(--text2)}
.up{color:#7bd88f}
.stat span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats + .stats{margin-top:-12px}
.yt-box,.ai-box{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:16px}
.yt-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.yt-head h3{margin:0 auto 0 0;font-size:16px}
.yt-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.yt-tiles div{background:var(--bg3);border-radius:10px;padding:10px 12px;min-width:0}
.yt-tiles b{font-size:20px}
.yt-tiles small{margin-left:6px;color:#7bd88f;font-size:12px}
.yt-tiles span{display:block;color:var(--text2);font-size:12px;margin-top:2px}
.yt-foot{margin-top:10px;font-size:12px;line-height:1.7}
.ai-ask{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#aiQ{flex:1;min-width:200px;height:36px;background:var(--bg);border:1px solid #303030;border-radius:18px;padding:0 14px;outline:none}
#aiQ:focus{border-color:#1c62b9}
.ai-ask label{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.ai-out{margin-top:14px;line-height:1.6;font-size:15px;word-break:break-word}
.ai-out h4{font-size:16px;margin:18px 0 6px}
.ai-out h4:first-child{margin-top:0}
.ai-out p{margin:6px 0}
.ai-out ul,.ai-out ol{margin:6px 0;padding-left:22px}
.ai-out li{margin:3px 0}
.ai-out code{background:var(--bg3);padding:1px 5px;border-radius:4px}
.ai-wait{color:var(--text2);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.dialog h3{margin:28px 0 4px;font-size:18px}
.dialog input[type=password],.dialog select{width:100%;background:var(--bg);border:1px solid #303030;border-radius:8px;padding:10px 12px;outline:none;color-scheme:dark}
.dialog input[type=password]:focus,.dialog select:focus{border-color:#1c62b9}
.dialog .dlg-row input{flex:1;min-width:0}
.howto{margin-top:8px;color:var(--text2);font-size:13px}
.howto summary{cursor:pointer;color:var(--blue)}
.howto ol{padding-left:20px;line-height:1.7;margin:8px 0}
.pill[disabled]{opacity:.6;cursor:progress}

/* ---------- редактор этапа ---------- */
.rt-bar{display:flex;align-items:center;gap:2px;flex-wrap:wrap;padding:6px;background:var(--bg3);border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;position:sticky;top:56px;z-index:4}
.rt-bar button{height:32px;min-width:32px;padding:0 10px;border-radius:8px;font-size:14px}
.rt-bar button:hover{background:var(--bg4)}
.rt-bar button.on{background:#f1f1f1;color:#0f0f0f}
.rt-group{display:flex;gap:2px}
.rt-group .rt-h{font-weight:700}
.rt-group .rt-q{font-size:12px;color:var(--text2)}
.rt-group .rt-q.on{color:#0f0f0f}
.rt-mark{background:#6b5600;color:#fff;padding:0 4px;border-radius:3px}
.rt-sep{width:1px;height:20px;background:rgba(255,255,255,.15);margin:0 6px}
.rt{position:relative;min-height:340px;background:var(--bg2);border:1px solid var(--line);border-radius:0 0 12px 12px;padding:16px 18px;line-height:1.6;font-size:15px;outline:none;word-break:break-word}
.rt:focus{border-color:#555}
.rt.empty::before{content:attr(data-placeholder);position:absolute;left:18px;right:18px;top:16px;color:#6f6f6f;pointer-events:none}
.rt h3{font-size:20px;line-height:1.3;margin:18px 0 6px}
.rt > h3:first-child{margin-top:0}
.rt p{margin:0 0 8px}
.rt blockquote{margin:0 0 8px;padding:1px 0 1px 12px;border-left:3px solid #4a4a4a;color:var(--text2);font-size:13px}
.rt ul,.rt ol{margin:0 0 8px;padding-left:24px}
.rt mark,.rt span[style*="background"]{background:#6b5600!important;color:#fff;border-radius:3px;padding:0 2px}
.pct-seg{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pct-seg span{margin-right:6px}
.pct-seg button{height:32px;padding:0 12px;border-radius:16px;background:var(--bg3);font-weight:500;font-size:13px}
.pct-seg button:hover{background:var(--bg4)}
.pct-seg button.on{background:#f1f1f1;color:#0f0f0f}
.check.part{border-color:var(--red);background:conic-gradient(rgba(255,0,51,.75) calc(var(--p) * 1%), transparent 0)}
.pl-part{position:absolute;left:0;bottom:0;height:4px;background:var(--red);border-radius:0 2px 2px 8px}
.update-bar{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:#263850;color:#cfe6ff;border:1px solid #2c4a6b;padding:8px 8px 8px 16px;border-radius:12px;z-index:250;box-shadow:0 4px 24px rgba(0,0,0,.5);white-space:nowrap}

/* ---------- дедлайны этапов ---------- */
.dl-pill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:18px;background:var(--bg3);color:var(--text2);font-size:13px;white-space:nowrap}
.dl-pill input{background:none;border:0;outline:none;color:var(--text);color-scheme:dark;width:128px}
.dl-pill.late{box-shadow:inset 0 0 0 1px #ff7a7a;color:#ff7a7a}
.pl-dl{font-size:11px;color:var(--text2)}
.pl-dl.late{color:#ff7a7a}
.pl-dl.soon{color:var(--yellow)}
.pl-tools{display:flex;gap:8px;margin-top:10px}
.pl-tools .pill{height:30px;font-size:12px;padding:0 12px}
.dl-list{display:grid;gap:6px}
.dl-row{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--bg2);border-radius:10px;cursor:pointer;min-width:0}
.dl-row:hover{background:var(--bg3)}
.dl-row .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl-row .t small{color:var(--text2);margin-left:6px}

<script>
const APP_VERSION = 8; // запускатор сравнивает с версией файла на диске и предлагает обновить страницу

/* ================= утилиты ================= */
const $ = (s, r = document) => r.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const plural = (n, [one, few, many]) => {
  const a = n % 10, b = n % 100;
  return n + ' ' + (a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many);
};
function ago(ts) {
  const s = (Date.now() - ts) / 1000;
  if (s < 60) return 'только что';
  const m = s / 60, h = m / 60, d = h / 24;
  if (m < 60) return plural(Math.floor(m), ['минуту', 'минуты', 'минут']) + ' назад';
  if (h < 24) return plural(Math.floor(h), ['час', 'часа', 'часов']) + ' назад';
  if (d < 7) return plural(Math.floor(d), ['день', 'дня', 'дней']) + ' назад';
  if (d < 30) return plural(Math.floor(d / 7), ['неделю', 'недели', 'недель']) + ' назад';
  if (d < 365) return plural(Math.floor(d / 30), ['месяц', 'месяца', 'месяцев']) + ' назад';
  return plural(Math.floor(d / 365), ['год', 'года', 'лет']) + ' назад';
}
const fmtDate = iso => iso ? new Date(iso + 'T00:00').toLocaleDateString('ru-RU', {day: 'numeric', month: 'short'}) : '';
const fmtFull = ts => new Date(ts).toLocaleDateString('ru-RU', {day: 'numeric', month: 'long', year: 'numeric'});

/* ----- даты и дедлайны (формат YYYY-MM-DD, по местному времени) ----- */
const isoOf = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const todayIso = () => isoOf(new Date());
const isoPlus = (iso, n) => { const d = new Date(iso + 'T00:00'); d.setDate(d.getDate() + n); return isoOf(d); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00') - new Date(a + 'T00:00')) / 864e5);
const dlClass = date => date < todayIso() ? 'late' : date <= isoPlus(todayIso(), 2) ? 'soon' : '';
function dueText(date) {
  const n = daysBetween(todayIso(), date);
  const rel = n < 0 ? 'просрочено на ' + plural(-n, ['день', 'дня', 'дней']) : n === 0 ? 'сегодня' : n === 1 ? 'завтра'
    : 'через ' + plural(n, ['день', 'дня', 'дней']);
  return `${rel} · ${fmtDate(date)}`;
}
function upcomingDeadlines(daysAhead = 14) {
  const limit = isoPlus(todayIso(), daysAhead), items = [];
  for (const v of state.videos) {
    if (v.yt) continue; // уже на YouTube
    if (v.deadline && progress(v) < 100 && v.deadline <= limit) items.push({v, date: v.deadline, label: 'Выход видео', icon: '🎬'});
    for (const s of v.stages) if (s.deadline && !s.done && s.deadline <= limit) items.push({v, s, date: s.deadline, label: s.name, icon: stageIcon(s.name)});
  }
  return items.sort((a, b) => a.date.localeCompare(b.date));
}
function deadlinesHtml() {
  const items = upcomingDeadlines();
  if (!items.length) return '';
  return `<section class="shelf" style="margin-bottom:24px">
    <h2>⏰ Ближайшие дедлайны <small>${items.length}</small></h2>
    <div class="dl-list">${items.slice(0, 8).map(it => `
      <div class="dl-row" data-act="open" data-id="${it.v.id}" ${it.s ? `data-sid="${it.s.id}"` : ''}>
        <span>${it.icon}</span>
        <div class="t"><b>${esc(it.label)}</b><small>${esc(it.v.title || 'Без названия')}</small></div>
        <span class="when ${dlClass(it.date)}">${dueText(it.date)}</span>
      </div>`).join('')}
    </div>
  </section>`;
}

const stagePct = s => s.done ? 100 : Math.min(75, Math.max(0, Number(s.pct) || 0));
const progress = v => v.stages.length ? Math.round(v.stages.reduce((sum, s) => sum + stagePct(s), 0) / v.stages.length) : 0;
const nextStage = v => v.stages.find(s => !s.done);
const status = v => { const p = progress(v); return p === 100 ? 'done' : p === 0 ? 'idea' : 'work'; };
const isLate = v => v.deadline && progress(v) < 100 && new Date(v.deadline + 'T23:59:59') < new Date();

const GRADS = [['#ff512f','#dd2476'],['#4776e6','#8e54e9'],['#11998e','#38ef7d'],['#f7971e','#ffd200'],
  ['#fc466b','#3f5efb'],['#00c6ff','#0072ff'],['#e96443','#904e95'],['#1d976c','#93f9b9'],['#ee0979','#ff6a00']];
function grad(id) {
  let h = 0;
  for (const c of id) h = (h * 31 + c.charCodeAt(0)) | 0;
  const g = GRADS[Math.abs(h) % GRADS.length];
  return `linear-gradient(135deg,${g[0]},${g[1]})`;
}
const ICONS = [['иде','💡'],['план','🗂️'],['сценар','📝'],['текст','📝'],['съём','🎥'],['съем','🎥'],['видеомат','🎥'],
  ['материал','🎥'],['озвуч','🎙️'],['звук','🎧'],['музык','🎵'],['монтаж','✂️'],['цвет','🎨'],['субтит','💬'],['превью','🖼️'],
  ['облож','🖼️'],['назван','🏷️'],['описан','🏷️'],['тег','🏷️'],['публик','🚀'],['загруз','🚀'],['реклам','📣'],['провер','🔍']];
function stageIcon(name) {
  const n = name.toLowerCase();

}

// Картинка → сжатый JPEG в base64 (чтобы файл не раздувался)
function fileToDataUrl(file, maxW, maxH) {
  return new Promise(res => {
    if (!file || !file.type.startsWith('image/')) return res(null);
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, maxW / img.width, maxH / img.height);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k);
      c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(null); };
    img.src = url;
  });
}
function pickFile(accept) {
  return new Promise(res => {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = accept;
    inp.onchange = () => res(inp.files[0] || null);
    inp.click();
  });
}
const pickImage = async (w, h) => fileToDataUrl(await pickFile('image/*'), w, h);

function makeVideo(type, title = '') {

    stages: state.template.map(name => ({id: uid(), name, done: false, notes: '', deadline: '', pct: 0, rich: true}))};

function normalize(s) {
  const ch = {name: 'Мой канал', handle: '@moy_kanal', description: '', avatar: '', banner: '', lang: ''};
  s = Object.assign({version: 1, updatedAt: 0, everSaved: false, template: DEFAULT_TEMPLATE.slice(), videos: []}, s || {});
  s.channel = Object.assign(ch, s.channel || {});
  if (!Array.isArray(s.template) || !s.template.length) s.template = DEFAULT_TEMPLATE.slice();
  s.videos = (Array.isArray(s.videos) ? s.videos : []).map(v => ({
    id: v.id || uid(), type: v.type === 'short' ? 'short' : 'video', title: v.title || '', notes: v.notes || '',
    link: v.link || '', deadline: v.deadline || '', thumb: v.thumb || '', inspo: v.inspo || '',
    createdAt: v.createdAt || Date.now(), updatedAt: v.updatedAt || v.createdAt || Date.now(),
    yt: v.yt || null, ytHistory: Array.isArray(v.ytHistory) ? v.ytHistory : [], ai: v.ai || null, ytAnalytics: v.ytAnalytics || null,
    stages: (Array.isArray(v.stages) ? v.stages : []).map(st => ({id: st.id || uid(), name: st.name || 'Этап', done: !!st.done, notes: st.notes || '',
      deadline: st.deadline || '', pct: st.done ? 100 : [25, 50, 75].includes(st.pct) ? st.pct : 0, rich: !!st.rich}))
  }));
  s.radar = {queries: [], days: 30, results: [], ...s.radar};
  s.ytSkip = Array.isArray(s.ytSkip) ? s.ytSkip : []; // ролики YouTube, удалённые из планера, — синхронизация их больше не предлагает
  s.competitors = (Array.isArray(s.competitors) ? s.competitors : []).filter(c => c && c.id)
    .map(c => ({...c, videos: Array.isArray(c.videos) ? c.videos : [], lastSeenAt: c.lastSeenAt || c.addedAt || Date.now()}));
  return s;
}

let state = null;
let dirty = false;        // есть изменения, которых ещё нет в data/planer.json
let canAutoFile = false;  // данные прочитаны с диска без ошибок — можно сохранять автоматически
let serverMode = false;   // планер открыт через «Запустить планер.bat» — без него данные недоступны
let saving = false, saveAgain = false;
let idbTimer, fileTimer;

/* ----- IndexedDB: страховочная копия в браузере ----- */
const DB_KEY = 'ytplanner:' + decodeURIComponent(location.pathname);
let dbPromise;
function db() {
  if (!dbPromise) dbPromise = new Promise((res, rej) => {
    const r = indexedDB.open('yt-planner', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbPromise;
}
async function idbGet(k) {
  try {
    const d = await db();
    return await new Promise((res, rej) => {
      const q = d.transaction('kv').objectStore('kv').get(k);
      q.onsuccess = () => res(q.result);
      q.onerror = () => rej(q.error);
    });
  } catch (e) { return undefined; }
}
async function idbSet(k, v) {
  try {
    const d = await db();
    await new Promise((res, rej) => {
      const t = d.transaction('kv', 'readwrite');
      t.objectStore('kv').put(v, k);
      t.oncomplete = res;
      t.onerror = () => rej(t.error);
    });
  } catch (e) {}
}

// Вызывать после любого изменения данных
function touch(video) {
  state.updatedAt = Date.now();
  if (video) video.updatedAt = state.updatedAt;
  dirty = true;
  sessionEdits = true;
  clearTimeout(idbTimer);
  idbTimer = setTimeout(() => idbSet(DB_KEY, state), 300);
  if (canAutoFile) {
    clearTimeout(fileTimer);
    fileTimer = setTimeout(() => saveToFile(false), 1200);
  }
  updateStatus();
}

/* ----- запись данных в data/planer.json через запускатор ----- */
// Новые картинки уходят на сервер как data:image/…, он сохраняет их в data/images и возвращает пути
function pendingImages() {
  const out = {};
  if (state.channel.avatar?.startsWith('data:')) out['channel:avatar'] = state.channel.avatar;
  if (state.channel.banner?.startsWith('data:')) out['channel:banner'] = state.channel.banner;
  for (const v of state.videos) if (v.thumb?.startsWith('data:')) out[`video:${v.id}:thumb`] = v.thumb;
  return out;
}
function applyImagePaths(replaced, sent) {
  for (const [key, file] of replaced || []) {
    const [kind, id, field] = key.split(':');
    if (kind === 'channel' && state.channel[id] === sent[key]) state.channel[id] = file;
    const v = kind === 'video' && state.videos.find(x => x.id === id);
    if (v && v[field] === sent[key]) v[field] = file; // если картинку за это время не поменяли
  }
}

async function saveToFile(interactive) {
  if (!canAutoFile) {
    if (interactive) toast('Данные не прочитались с диска — сохранение выключено, чтобы ничего не затереть. Перезапусти планер.', 8000);
    return;
  }
  if (saving) { saveAgain = true; return; }
  saving = true;
  const ver = state.updatedAt, sent = pendingImages();
  try {
    const r = await fetch('/api/data', {method: 'PUT', headers: {'x-planer': '1', 'content-type': 'application/json'}, body: JSON.stringify(state)});
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error?.message || 'ошибка ' + r.status);
    applyImagePaths(d.replaced, sent);
    checkAppVersion(d.appVersion);
    if (state.updatedAt === ver) dirty = false;
    idbSet(DB_KEY, state);
    if (interactive) toast('✓ Всё сохранено в data/planer.json');
  } catch (e) {
    toast(e instanceof TypeError ? 'Нет связи с запускатором — окно «Запустить планер» закрыто? Изменения пока сохранены в браузере.' : 'Не удалось сохранить: ' + e.message, 7000);
  } finally {
    saving = false;
    updateStatus();
    if (saveAgain) { saveAgain = false; if (dirty) saveToFile(false); }
  }
}

// Файл на диске обновили, а вкладка открыта со старым кодом — предлагаем перезагрузить (данные уже сохранены)
let updateNoticeShown = false;
function checkAppVersion(diskVersion) {
  if (!(diskVersion > APP_VERSION) || updateNoticeShown) return;
  updateNoticeShown = true;
  const bar = document.createElement('div');
  bar.className = 'update-bar';
  bar.innerHTML = '🎉 Планер обновился <button class="pill white">Обновить страницу</button>';
  bar.querySelector('button').onclick = () => location.reload();
  document.body.append(bar);
}

function updateStatus() {
  const el = $('#saveStatus'), btn = $('#saveBtn');
  if (!dirty) {
    el.textContent = '✓ Сохранено';
    el.className = 'save-status ok';
    btn.className = 'pill';
  } else if (canAutoFile) {
    el.textContent = 'Сохраняется…';
    el.className = 'save-status';
    btn.className = 'pill';
  } else {
    el.textContent = '● Не сохранено';
    el.className = 'save-status dirty';
    btn.className = 'pill attn';
  }
}

function listFor(type) {
  let list = state.videos.filter(v => type === 'all' || v.type === type);
  if (ui.q) list = list.filter(v => [v.title, v.notes, ...v.stages.map(s => s.name + ' ' + stageText(s))]
    .join(' ').toLowerCase().includes(ui.q));
  return list;
}

function renderTab() {
  const body = $('#tabBody');
  if (!body) return;
  if (ui.tab === 'home') return renderHome(body);
  if (ui.tab === 'calendar') return renderCalendar(body);
  if (ui.tab === 'analytics') return renderAnalytics(body);
  const type = ui.tab === 'shorts' ? 'short' : 'video';
  let list = listFor(type);
  const counts = {all: list.length};
  for (const k of ['work', 'idea', 'done']) counts[k] = list.filter(v => status(v) === k).length;
  if (ui.filter !== 'all') list = list.filter(v => status(v) === ui.filter);
  const sorters = {
    new: (a, b) => b.createdAt - a.createdAt,
    old: (a, b) => a.createdAt - b.createdAt,
    progress: (a, b) => progress(b) - progress(a),
    deadline: (a, b) => (a.deadline || '9999').localeCompare(b.deadline || '9999'),
    updated: (a, b) => b.updatedAt - a.updatedAt
  };
  list.sort(sorters[ui.sort]);
  body.innerHTML = `<div class="chips">
      ${[['all', 'Все'], ['work', 'В работе'], ['idea', 'Не начатые'], ['done', 'Готовые']].map(([k, t]) =>
        `<button class="chip ${ui.filter === k ? 'active' : ''}" data-act="filter" data-f="${k}">${t}<span class="cnt">${counts[k]}</span></button>`).join('')}
      <select id="sort" title="Сортировка">
        ${[['new', 'Сначала новые'], ['old', 'Сначала старые'], ['updated', 'Недавно изменённые'], ['progress', 'По готовности'], ['deadline', 'По дедлайну']]
          .map(([k, t]) => `<option value="${k}" ${ui.sort === k ? 'selected' : ''}>${t}</option>`).join('')}
      </select>
    </div>
    ${list.length ? `<div class="grid ${type === 'short' ? 'shorts' : ''}">${list.map(cardHtml).join('')}</div>` : emptyHtml(type)}`;
}

  const out = document.createElement('div');
  (function walk(from, to) {
    for (const n of from.childNodes) {

      if (n.nodeType !== 1 || RT_SKIP.test(n.tagName)) continue;

      if (name === 'b' && /^(normal|[1-5]00)$/.test(st.fontWeight)) name = null; // Google Docs оборачивает всё в <b style="font-weight:normal">
      const wrap = tag => { const el = document.createElement(tag); target.append(el); target = el; };
      if (name) wrap(name);
      if (name !== 'b' && /^(bold|[6-9]00)$/.test(st.fontWeight)) wrap('b');
      if (name !== 'i' && st.fontStyle === 'italic') wrap('i');
      if (name !== 'u' && /underline/.test(deco)) wrap('u');

const YT_API = 'https://www.googleapis.com/youtube/v3/';

function ytIdFrom(link) {

  if (/^[\w-]{11}$/.test(s)) return s;
  const m = s.match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/live\/|\/embed\/)([\w-]{11})/);
  return m ? m[1] : '';
}

  return m ? (+m[1] || 0) * 86400 + (+m[2] || 0) * 3600 + (+m[3] || 0) * 60 + (+m[4] || 0) : 0;
}

  return h ? `${h}:${String(m).padStart(2, '0')}:${sec}` : `${m}:${sec}`;

async function ytGet(path, params, key = secrets.ytKey) {
  if (!key) throw new Error('Добавь ключ YouTube API: «Настроить канал» → «Подключения»');
  let r;
  try { r = await fetch(YT_API + path + '?' + new URLSearchParams({...params, key})); }
  catch (e) { throw new Error('Нет связи с YouTube API — проверь интернет'); }
  const data = await r.json().catch(() => ({}));
  if (r.ok) return data;
  // в сообщении показываем и точный ответ Google — по нему видно настоящую причину
  const msg = data.error?.message || '', all = JSON.stringify(data.error || {}), google = msg ? ` (Google: ${msg})` : '';
  if (/quotaExceeded/.test(all)) throw new Error('Дневной лимит YouTube API исчерпан — попробуй завтра');
  if (/commentsDisabled/.test(all)) throw new Error('Комментарии к этому видео отключены');
  if (/referer|REFERRER_BLOCKED/i.test(all)) throw new Error('У ключа стоит ограничение «Websites» — в Google Cloud поставь «Application restrictions: None»' + google);
  if (/IP address|IP_ADDRESS_BLOCKED/i.test(all)) throw new Error('У ключа стоит ограничение по IP — в Google Cloud поставь «Application restrictions: None»' + google);
  if (/SERVICE_BLOCKED|are blocked/i.test(all)) throw new Error('В «API restrictions» ключа не выбран YouTube Data API v3 — добавь его' + google);
  if (/accessNotConfigured|SERVICE_DISABLED|has not been used|is disabled/i.test(all)) throw new Error('В проекте этого ключа не включён YouTube Data API v3 — включи его в Google Cloud' + google);
  if (/expired/i.test(all)) throw new Error('Срок действия ключа истёк — создай новый в Google Cloud' + google);
  if (/API key|API_KEY_INVALID/i.test(all)) throw new Error('Google не принимает этот ключ YouTube — скорее всего, его пересоздали или удалили. Скопируй ключ заново из Google Cloud' + google);
  throw new Error('YouTube API: ' + (msg || 'ошибка ' + r.status));
}

async function urlToDataUrl(url, w, h) {
  if (!url) return '';
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error();
    return (await fileToDataUrl(await r.blob(), w, h)) || url;
  } catch (e) { return url; }
}

    duration: isoDur(item.contentDetails?.duration), ...snap};
  // история замеров: не чаще одной точки в час, чтобы был виден прирост
  const hist = v.ytHistory || [], point = {t: Date.now(), ...snap};
  if (hist.length && Date.now() - hist[hist.length - 1].t < 3600e3) hist[hist.length - 1] = point;
  else hist.push(point);
  v.ytHistory = hist.slice(-120);
}

async function ytRefresh(videos) {
  const pairs = videos.map(v => [v, ytIdFrom(v.link)]).filter(([, id]) => id);
  let n = 0;
  for (let i = 0; i < pairs.length; i += 50) {
    const chunk = pairs.slice(i, i + 50);
    const data = await ytGet('videos', {part: 'snippet,statistics,contentDetails', id: chunk.map(([, id]) => id).join(',')});
    const byId = Object.fromEntries((data.items || []).map(it => [it.id, it]));
    for (const [v, id] of chunk) if (byId[id]) { applyYt(v, byId[id]); n++; }
  }
  return n;
}

async function ytTopComments(id) {
  try {
    const d = await ytGet('commentThreads', {part: 'snippet', videoId: id, order: 'relevance', maxResults: 40, textFormat: 'plainText'});
    return (d.items || []).map(it => {
      const c = it.snippet.topLevelComment.snippet;
      return {text: String(c.textDisplay || '').slice(0, 500), likes: c.likeCount || 0};
    });
  } catch (e) { return []; }
}

async function syncYouTube(btn) {
  if (!secrets.ytKey) { openSettings(true); return toast('Сначала добавь ключ YouTube API'); }
  const c = state.channel, handle = c.handle.trim();
  if (!handle || handle === '@moy_kanal') { openSettings(); return toast('Укажи @имя своего канала в поле «Имя пользователя»', 6000); }
  busy(btn, true, '⏳ Синхронизация…');
  try {
    const data = await ytGet('channels', {part: 'snippet,statistics,contentDetails,brandingSettings', forHandle: handle.startsWith('@') ? handle : '@' + handle});
    const ch = data.items?.[0];
    if (!ch) throw new Error(`Канал ${handle} не найден на YouTube — проверь @имя в настройках`);
    const st = ch.statistics || {};
    c.yt = {id: ch.id, subs: +st.subscriberCount || 0, hiddenSubs: !!st.hiddenSubscriberCount, views: +st.viewCount || 0,
      videos: +st.videoCount || 0, fetchedAt: Date.now()};
    channelPoint(c);
    const ava = ch.snippet?.thumbnails?.high?.url || ch.snippet?.thumbnails?.default?.url;
    // аватар и баннер берём с YouTube, если пользователь не загрузил свои вручную
    if (ava && !c.avatarCustom && c.avatarSrc !== ava) {
      const img = await imageFromYoutube([ava.replace(/=s\d+/, '=s400'), ava], 400, 400);
      if (img) { c.avatar = img; c.avatarSrc = ava; }
    }
    const banner = ch.brandingSettings?.image?.bannerExternalUrl;
    if (banner && !c.bannerCustom && c.bannerSrc !== banner) {
      const img = await imageFromYoutube([banner + '=w2560-fcrop64=1,00005a57ffffa5a8-k-c0xffffffff-no-nd-rj', banner + '=w2560', banner], 2560, 1440);
      if (img) { c.banner = img; c.bannerSrc = banner; }
    }

    // все загрузки канала → каких видео ещё нет в планере
    const uploads = ch.contentDetails?.relatedPlaylists?.uploads, ids = [];
    let pageToken = '';
    do {
      const pl = await ytGet('playlistItems', {part: 'contentDetails', playlistId: uploads, maxResults: 50, ...(pageToken && {pageToken})});
      ids.push(...(pl.items || []).map(it => it.contentDetails.videoId));
      pageToken = pl.nextPageToken || '';
    } while (pageToken && ids.length < 500);
    const kinds = await channelKinds(ch.id, 0, 5000); // точное разделение на видео, Shorts и трансляции
    const known = new Set([...state.videos.map(v => ytIdFrom(v.link)).filter(Boolean), ...state.ytSkip]);
    const fresh = ids.filter(id => !known.has(id));
    let added = 0;
    if (fresh.length && confirm(`На канале ${plural(fresh.length, ['видео', 'видео', 'видео'])}, которых нет в планере. Добавить их как опубликованные?${kinds ? '' : '\n\nShorts определяются по длительности до 60 секунд — тип потом можно поменять.'}`)) {
      for (let i = 0; i < fresh.length; i += 50) {
        const d = await ytGet('videos', {part: 'snippet,statistics,contentDetails,liveStreamingDetails', id: fresh.slice(i, i + 50).join(',')});
        await Promise.all((d.items || []).map(async it => {
          const kind = kinds?.get(it.id) || (it.liveStreamingDetails ? 'live' : isoDur(it.contentDetails?.duration) <= 60 ? 'short' : 'video');
          const v = makeVideo(kind === 'short' ? 'short' : 'video', it.snippet.title);
          const th = it.snippet.thumbnails || {};
          v.link = 'https://youtu.be/' + it.id;
          v.stages.forEach(s => { s.done = true; s.pct = 100; });
          v.createdAt = Date.parse(it.snippet.publishedAt) || Date.now();
          v.thumb = await urlToDataUrl((th.maxres || th.standard || th.high || th.medium || th.default)?.url, 640, 360);
          applyYt(v, it);
          v.yt.live = kind === 'live';
          state.videos.push(v);
          added++;
        }));
      }
    }
    const updated = await ytRefresh(state.videos.filter(v => !fresh.includes(ytIdFrom(v.link))));
    if (kinds) for (const v of state.videos) { // уже добавленные ролики тоже раскладываем по настоящим типам
      const kind = v.yt && kinds.get(v.yt.id);
      if (kind) { v.type = kind === 'short' ? 'short' : 'video'; v.yt.live = kind === 'live'; }
    }
    touch();
    rerender();
    renderTopAvatar();
    toast(`✓ YouTube: ${added ? `добавлено ${plural(added, ['видео', 'видео', 'видео'])}, ` : ''}статистика обновлена у ${plural(updated + added, ['видео', 'видео', 'видео'])}`, 5000);
  } catch (e) { toast(e.message, 7000); }
  finally { busy(btn, false); }
}

// Свою статистику подтягиваем сами раз в 6 часов, пока планер открыт, — так копятся замеры для графика роста.
// Новые ролики сами не добавляем, только подсказываем: добавление остаётся за кнопкой «Синхронизировать с YouTube».
const OWN_SYNC_EVERY = 6 * 3600e3;
let ownSyncing = false, freshNotice = '';
async function autoSyncYouTube() {
  const c = state.channel, handle = c.handle.trim();
  if (!secrets.ytKey || !handle || handle === '@moy_kanal' || ownSyncing || Date.now() - (c.yt?.fetchedAt || 0) < OWN_SYNC_EVERY) return;
  ownSyncing = true;
  try {
    const ch = (await ytGet('channels', {part: 'statistics,contentDetails', forHandle: handle.startsWith('@') ? handle : '@' + handle})).items?.[0];
    if (!ch) return;
    const st = ch.statistics || {};
    c.yt = {...c.yt, id: ch.id, subs: +st.subscriberCount || 0, hiddenSubs: !!st.hiddenSubscriberCount, views: +st.viewCount || 0,
      videos: +st.videoCount || 0, fetchedAt: Date.now()};
    channelPoint(c);
    await ytRefresh(state.videos);
    const uploads = ch.contentDetails?.relatedPlaylists?.uploads;
    const known = new Set([...state.videos.map(v => ytIdFrom(v.link)).filter(Boolean), ...state.ytSkip]);
    const fresh = ((uploads && await playlistIds(uploads, 0, 50)) || []).filter(id => !known.has(id));
    touch();
    quietRerender();
    if (fresh.length && fresh.join() !== freshNotice) {
      freshNotice = fresh.join();
      toast(`На YouTube ${plural(fresh.length, ['новый ролик', 'новых ролика', 'новых роликов'])} — нажми «Синхронизировать с YouTube», чтобы добавить`, 8000);
    }
  } catch (e) { console.warn('Автосинхронизация с YouTube:', e.message); }
  finally { ownSyncing = false; }
}

  if (getVideo() || aiBusy || a?.isContentEditable || (app.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))

// Пробуем адреса по очереди: напрямую, а при запуске через запускатор — ещё и через него
async function imageFromYoutube(urls, w, h) {
  for (const url of urls) {
    for (const src of [url, ...(serverMode ? ['/api/image?url=' + encodeURIComponent(url)] : [])]) {
      try {
        const r = await fetch(src, src.startsWith('/') ? {headers: {'x-planer': '1'}} : {});
        if (!r.ok) continue;
        const data = await fileToDataUrl(await r.blob(), w, h);
        if (data) return data;
      } catch (e) {}
    }
  }
  return null;
}

/* ================= календарь публикаций ================= */
function calendarItems() {
  const items = [];
  for (const v of state.videos) {
    const title = v.title || v.yt?.title || 'Без названия';
    if (v.yt?.publishedAt) items.push({date: isoOf(new Date(v.yt.publishedAt)), kind: 'published', v, icon: '✅', text: title, done: true});
    else if (v.deadline) items.push({date: v.deadline, kind: 'release', v, icon: '🎬', text: title, done: progress(v) === 100});
    if (!v.yt) for (const s of v.stages) if (s.deadline) items.push({date: s.deadline, kind: 'stage', v, s, icon: stageIcon(s.name), text: `${s.name} · ${title}`, done: s.done});
  }
  return items;
}

function calItemHtml(it, today) {
  const late = !it.done && it.date < today, drag = it.kind !== 'published';
  return `<div class="cal-item ${it.kind} ${it.done && it.kind !== 'published' ? 'done' : ''} ${late ? 'late' : ''}"
    data-act="open" data-id="${it.v.id}" ${it.s ? `data-sid="${it.s.id}"` : ''} ${drag ? `draggable="true" data-drag="${it.v.id}|${it.s ? it.s.id : ''}"` : ''}
    title="${esc((late ? 'Просрочено: ' : '') + it.text)}">${it.icon}<span>${esc(it.text)}</span></div>`;
}

function renderCalendar(body) {
  const today = todayIso(), [y, m] = (ui.calMonth || today.slice(0, 7)).split('-').map(Number);
  const first = new Date(y, m - 1, 1), start = new Date(y, m - 1, 1 - (first.getDay() + 6) % 7);
  const order = {published: 0, release: 1, stage: 2}, byDate = {};
  for (const it of calendarItems()) (byDate[it.date] ||= []).push(it);
  const monthItems = calendarItems().filter(it => it.date.startsWith(`${y}-${String(m).padStart(2, '0')}`));
  const releases = monthItems.filter(it => it.kind !== 'stage').length, stages = monthItems.length - releases;
  const late = monthItems.filter(it => !it.done && it.date < today).length;
  let cells = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i), iso = isoOf(d);
    if (i % 7 === 0 && i >= 28 && d.getMonth() !== m - 1) break;
    const list = (byDate[iso] || []).sort((a, b) => order[a.kind] - order[b.kind]);
    cells += `<div class="cal-day ${d.getMonth() !== m - 1 ? 'other' : ''} ${iso === today ? 'today' : ''}" data-date="${iso}">
      <span class="cal-num">${d.getDate()}</span>${list.map(it => calItemHtml(it, today)).join('')}</div>`;
  }
  const title = first.toLocaleDateString('ru-RU', {month: 'long', year: 'numeric'}).replace(' г.', '');
  body.innerHTML = `
    <div class="cal-head">
      <button class="icon-btn" data-act="calnav" data-dir="-1" title="Предыдущий месяц">‹</button>
      <button class="icon-btn" data-act="calnav" data-dir="1" title="Следующий месяц">›</button>
      <h2>${title[0].toUpperCase() + title.slice(1)}</h2>
      <button class="pill" data-act="calnav" data-dir="0">Сегодня</button>
      <span class="muted">${plural(releases, ['выход', 'выхода', 'выходов'])} · ${plural(stages, ['дедлайн этапа', 'дедлайна этапов', 'дедлайнов этапов'])}${late ? ` · <span class="late">просрочено: ${late}</span>` : ''}</span>
    </div>
    <div class="cal-legend">
      <span><i style="background:rgba(255,0,51,.55)"></i>дедлайн видео (выход)</span>
      <span><i style="background:rgba(43,166,64,.7)"></i>вышло на YouTube</span>
      <span><i style="background:var(--bg4)"></i>дедлайн этапа</span>
      <span>Перетащи дедлайн на другой день, чтобы перенести</span>
    </div>
    <div class="cal">${['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].map(d => `<div class="cal-dow">${d}</div>`).join('')}${cells}</div>`;
}

  if (v.notes.trim()) L.push('', 'Описание и идея от автора:', v.notes.trim());
  for (const s of v.stages) {
    const text = stageText(s);
    if (text) L.push('', `Заметки этапа «${s.name}»:`, text);
  }
  if (y) {
    L.push('', `Статистика YouTube на ${new Date(y.fetchedAt).toLocaleString('ru-RU')}: просмотры ${y.views}, лайки ${y.likes}, ` +
      `комментарии ${y.comments}, опубликовано ${daysSince(v)} дн. назад, длительность ${fmtDur(y.duration)}.`);
    const a = state.analytics?.videos?.[y.id], rc = reachFor(state.analytics?.days || 28).videos[y.id];
    if (a) L.push(`За последние ${state.analytics.days} дн.: просмотры ${a.views}, средний % досмотра ${Math.round(a.avgPct)}%, ` +
      `средняя длительность просмотра ${fmtDur(Math.round(a.avgDur))}, новых подписчиков ${a.subs}.`);
    if (rc?.impr) L.push(`CTR превью: ${pct(rc.ctr)} при ${rc.impr} показах.`);
    const va = v.ytAnalytics;
    if (va?.retention?.length) {
      const at = r => Math.round(va.retention.reduce((best, p) => Math.abs(p[0] - r) < Math.abs(best[0] - r) ? p : best)[1] * 100) + '%';
      L.push(`Удержание (доля зрителей в этот момент видео): 10% — ${at(0.1)}, 25% — ${at(0.25)}, 50% — ${at(0.5)}, 75% — ${at(0.75)}, конец — ${at(1)}.`);
    }
    if (va?.traffic?.length) L.push('Источники трафика: ' + va.traffic.slice(0, 6).map(([t, n]) => `${TRAFFIC[t] || t} — ${n}`).join(', ') + '.');
    if (y.title && y.title !== v.title) L.push('Название на YouTube: ' + y.title);
    if (y.tags?.length) L.push('Теги: ' + y.tags.join(', '));
    if (y.description) L.push('Описание на YouTube:', y.description);
    const h = v.ytHistory || [];
    if (h.length > 1) L.push('Замеры (дата: просмотры/лайки/комментарии): ' +
      h.slice(-15).map(p => `${new Date(p.t).toLocaleDateString('ru-RU')}: ${p.views}/${p.likes}/${p.comments}`).join('; '));
  }
  const others = published(v).slice(0, 40);
  if (others.length) L.push('', 'Другие опубликованные видео канала для сравнения ' + YT_HEAD + ':', ...others.map(ytLine));
  if (comments.length) L.push('', 'Популярные комментарии зрителей (лайков — текст):', ...comments.map(k => `- ${k.likes} — ${k.text.replace(/\s+/g, ' ')}`));
  if (v.thumb) L.push('', 'Если к сообщению приложена картинка — это превью этого видео.');
  L.push('', y ? TASK_PUBLISHED : TASK_DRAFT);
  if (question) L.push('', 'Отдельный вопрос автора, ответь на него обязательно: ' + question);
  return L.join('\n');
}

function channelPrompt(question) {

async function readSSE(res, onEvent) {
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = '';
  for (;;) {
    const {done, value} = await reader.read();
    if (done) break;
    buf = (buf + dec.decode(value, {stream: true})).replace(/\r\n/g, '\n');
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0) {
      const data = buf.slice(0, i).split('\n').filter(l => l.startsWith('data:')).map(l => l.slice(5).trim()).join('');
      buf = buf.slice(i + 2);
      if (data && data !== '[DONE]') onEvent(JSON.parse(data));
    }
  }
}

async function aiHttpError(r, model) {
  const d = await r.json().catch(() => ({}));
  const msg = d.error?.message || '';
  if (r.status === 401 || r.status === 403 || /API key/i.test(msg)) return new Error('Ключ ИИ не подходит — проверь его в «Подключениях»');
  if (r.status === 404 || /not found/i.test(msg)) return new Error(`Модель «${model}» недоступна — выбери другую в «Подключениях» (кнопка «Список моделей»)`);
  if (r.status === 429) return new Error('Лимит запросов к ИИ исчерпан — подожди немного или проверь тариф');
  if (/credit|billing|balance|quota/i.test(msg)) return new Error('Проблема с оплатой или лимитом ИИ: ' + msg);
  return new Error(`Ошибка ИИ (${r.status}): ${msg || 'неизвестная'}`);
}

async function callClaude({system, text, images}, onText) {
  const model = aiModel(), fallback = /^claude-(opus-5|fable-5)/.test(model);
  const headers = {'content-type': 'application/json', 'x-api-key': aiKey(), 'anthropic-version': '2023-06-01',
    'anthropic-dangerous-direct-browser-access': 'true'};
  // если модель откажется отвечать, сервер сам передаст запрос рекомендованной запасной модели
  if (fallback) headers['anthropic-beta'] = 'server-side-fallback-2026-07-01';
  const content = images.map(im => ({type: 'image',
    source: im.data ? {type: 'base64', media_type: im.mime, data: im.data} : {type: 'url', url: im.url}}));
  content.push({type: 'text', text});
  const r = await fetch('https://api.anthropic.com/v1/messages', {method: 'POST', headers,
    body: JSON.stringify({model, max_tokens: 16000, stream: true, ...(fallback && {fallbacks: 'default'}),
      system, messages: [{role: 'user', content}]})});
  if (!r.ok) throw await aiHttpError(r, model);
  let out = '', stop = '', used = model;
  await readSSE(r, ev => {
    if (ev.type === 'message_start' && ev.message?.model) used = ev.message.model;
    else if (ev.type === 'content_block_delta' && ev.delta?.type === 'text_delta') onText(out += ev.delta.text);
    else if (ev.type === 'message_delta' && ev.delta?.stop_reason) stop = ev.delta.stop_reason;
    else if (ev.type === 'error') throw new Error('Ошибка ИИ: ' + (ev.error?.message || 'ответ прервался'));
  });
  if (stop === 'refusal') throw new Error('ИИ отказался отвечать на этот запрос');
  return {text: out, model: used};
}

// ChatGPT: браузер не может обратиться к OpenAI напрямую, поэтому запрос идёт через запускатор
async function callOpenAI({system, text, images}, onText) {
  if (!serverMode) throw new Error('ChatGPT работает, только когда планер открыт через «Запустить планер.bat»');
  const model = aiModel();
  const content = [{type: 'input_text', text},
    ...images.map(im => ({type: 'input_image', image_url: im.data ? `data:${im.mime};base64,${im.data}` : im.url}))];
  const r = await fetch('/api/openai/responses', {method: 'POST',
    headers: {'content-type': 'application/json', 'x-planer': '1', 'x-openai-key': aiKey()},
    body: JSON.stringify({model, instructions: system, stream: true, input: [{role: 'user', content}]})});
  if (!r.ok) throw await aiHttpError(r, model);
  let out = '', used = model;
  await readSSE(r, ev => {
    if (ev.type === 'response.created' && ev.response?.model) used = ev.response.model;
    else if (ev.type === 'response.output_text.delta' && ev.delta) onText(out += ev.delta);
    else if (ev.type === 'response.failed') throw new Error('Ошибка ИИ: ' + (ev.response?.error?.message || 'запрос не выполнен'));
    else if (ev.type === 'error') throw new Error('Ошибка ИИ: ' + (ev.message || ev.error?.message || 'ответ прервался'));
  });
  return {text: out, model: used};
}

async function callGemini({system, text, images}, onText) {
  const model = aiModel();
  const parts = images.filter(im => im.data).map(im => ({inlineData: {mimeType: im.mime, data: im.data}}));
  parts.push({text});
  const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:streamGenerateContent?alt=sse`, {
    method: 'POST', headers: {'content-type': 'application/json', 'x-goog-api-key': aiKey()},
    body: JSON.stringify({systemInstruction: {parts: [{text: system}]}, contents: [{role: 'user', parts}]})});
  if (!r.ok) throw await aiHttpError(r, model);
  let out = '';
  await readSSE(r, ev => {
    if (ev.error) throw new Error('Ошибка ИИ: ' + ev.error.message);
    if (ev.promptFeedback?.blockReason) throw new Error('Gemini заблокировал запрос: ' + ev.promptFeedback.blockReason);
    const t = (ev.candidates?.[0]?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('');
    if (t) onText(out += t);
  });
  return {text: out, model};
}

// Мини-markdown: заголовки, списки, **жирный**, *курсив*, `код` (текст экранируется)
function mdToHtml(md) {
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>').replace(/`([^`]+)`/g, '<code>$1</code>');
  let html = '', list = '';
  const close = () => { if (list) { html += `</${list}>`; list = ''; } };
  const open = tag => { if (list !== tag) { close(); html += `<${tag}>`; list = tag; } };
  for (const line of String(md).split('\n')) {
    let m;
    if ((m = line.match(/^\s*#{1,6}\s+(.*)/))) { close(); html += `<h4>${inline(m[1])}</h4>`; }
    else if ((m = line.match(/^\s*[-*•]\s+(.*)/))) { open('ul'); html += `<li>${inline(m[1])}</li>`; }
    else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { open('ol'); html += `<li>${inline(m[1])}</li>`; }
    else if (!line.trim()) close();
    else { close(); html += `<p>${inline(line)}</p>`; }
  }
  close();
  return html;
}

// Превью для ИИ отправляем картинкой в base64 (файл из data/images сначала читаем)
async function thumbImages(v) {
  if (!v.thumb) return [];
  let src = v.thumb;
  if (!src.startsWith('data:')) {
    try { src = await fileToDataUrl(await (await fetch(src)).blob(), 1280, 1280); } catch (e) { src = null; }
  }
  const m = src && src.match(/^data:([^;]+);base64,(.+)$/);
  return m ? [{mime: m[1], data: m[2]}] : [];
}

const AN_PERIODS = [[7, '7 дней'], [28, '28 дней'], [90, '90 дней'], [365, 'Год']];
const sum = (arr, k) => arr.reduce((s, x) => s + (Number(x[k]) || 0), 0);
const pct = x => (x * 100).toFixed(1).replace('.', ',') + '%';
const mk = (tag, text) => Object.assign(document.createElement(tag), {textContent: text});
let gAuth = {token: '', exp: 0};
const googleConnected = () => !!gAuth.token && Date.now() < gAuth.exp - 60e3;

function loadGis() {
  if (window.google?.accounts?.oauth2) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.onload = res;
    s.onerror = () => rej(new Error('Не удалось загрузить вход Google — проверь интернет'));
    document.head.appendChild(s);
  });
}

function googleToken(interactive) {
  if (googleConnected()) return Promise.resolve(gAuth.token);
  if (!serverMode) return Promise.reject(new Error('CTR и удержание доступны, только когда планер открыт через «Запустить планер.bat»'));
  if (!secrets.oauthClientId) return Promise.reject(new Error('Добавь OAuth Client ID: «Настроить канал» → «Подключения»'));
  if (!interactive) return Promise.reject(new Error('Нажми «Подключить Google»'));
  return loadGis().then(() => new Promise((res, rej) => {
    google.accounts.oauth2.initTokenClient({
      client_id: secrets.oauthClientId,
      scope: 'https://www.googleapis.com/auth/yt-analytics.readonly',
      callback: r => {
        if (r.error) return rej(new Error('Google: ' + (r.error_description || r.error)));
        gAuth = {token: r.access_token, exp: Date.now() + (Number(r.expires_in) || 3600) * 1000};
        res(gAuth.token);
      },
      error_callback: e => rej(new Error(e?.type === 'popup_closed' ? 'Окно входа Google закрыто' : 'Google: ' + (e?.message || e?.type || 'вход не удался')))
    }).requestAccessToken();
  }));
}

async function gGet(url) {
  const token = await googleToken(false);
  const r = await fetch(url, {headers: {authorization: 'Bearer ' + token}});
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { gAuth = {token: '', exp: 0}; throw new Error('Вход Google истёк — нажми «Подключить Google» ещё раз'); }
  if (!r.ok) {
    const msg = d.error?.message || 'ошибка ' + r.status;
    if (/has not been used|is disabled/i.test(msg)) throw new Error(`Включи «${url.includes('reporting') ? 'YouTube Reporting API' : 'YouTube Analytics API'}» в Google Cloud`);
    throw new Error('Google API: ' + msg);
  }
  return d;
}
const tableRowsOf = d => { const cols = (d.columnHeaders || []).map(h => h.name); return (d.rows || []).map(r => Object.fromEntries(cols.map((c, i) => [c, r[i]]))); };

async function fetchAnalytics(days) {
  const end = isoPlus(todayIso(), -1), start = isoPlus(end, -(days - 1));
  const q = p => 'https://youtubeanalytics.googleapis.com/v2/reports?' + new URLSearchParams({ids: 'channel==MINE', startDate: start, endDate: end, ...p});
  const [daily, perVideo] = await Promise.all([
    gGet(q({metrics: 'views,estimatedMinutesWatched,subscribersGained,subscribersLost', dimensions: 'day', sort: 'day'})),
    gGet(q({metrics: 'views,estimatedMinutesWatched,averageViewDuration,averageViewPercentage,subscribersGained', dimensions: 'video', sort: '-views', maxResults: '200'}))
  ]);
  const videos = {};
  for (const r of tableRowsOf(perVideo)) videos[r.video] = {views: r.views, minutes: r.estimatedMinutesWatched, avgDur: r.averageViewDuration, avgPct: r.averageViewPercentage, subs: r.subscribersGained};
  state.analytics = {days, start, end, fetchedAt: Date.now(), videos,
    daily: tableRowsOf(daily).map(r => ({day: r.day, views: r.views, minutes: r.estimatedMinutesWatched, subs: r.subscribersGained - r.subscribersLost}))};
}

// CTR отдаётся только ежедневными CSV-отчётами: заказываем отчёт один раз, потом докачиваем новые дни
const YTR = 'https://youtubereporting.googleapis.com/v1/';
async function gList(url, field) {
  const out = [];
  let page = '';
  do {
    const d = await gGet(url + (page ? (url.includes('?') ? '&' : '?') + 'pageToken=' + encodeURIComponent(page) : ''));
    out.push(...(d[field] || []));
    page = d.nextPageToken || '';
  } while (page);
  return out;
}
async function fetchReach() {
  const token = await googleToken(false);
  let job = (await gList(YTR + 'jobs', 'jobs')).find(j => j.reportTypeId === 'channel_reach_basic_a1');
  if (!job) {
    const r = await fetch(YTR + 'jobs', {method: 'POST', headers: {authorization: 'Bearer ' + token, 'content-type': 'application/json'},
      body: JSON.stringify({reportTypeId: 'channel_reach_basic_a1', name: 'YouTube-планер: CTR'})});
    job = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(job.error?.message || 'не удалось заказать отчёт (' + r.status + ')');
    state.reach = {jobId: job.id, days: {}, created: {}, done: [], orderedAt: Date.now()};
    return 'created';
  }
  if (state.reach?.jobId !== job.id) state.reach = {jobId: job.id, days: {}, created: {}, done: [], orderedAt: Date.parse(job.createTime) || Date.now()};
  const reach = state.reach, done = new Set(reach.done);
  const todo = (await gList(`${YTR}jobs/${job.id}/reports`, 'reports')).filter(r => !done.has(r.id))
    .sort((a, b) => (a.createTime || '').localeCompare(b.createTime || '')).slice(0, 90);
  for (const rep of todo) {
    const res = await fetch('/api/google-report?url=' + encodeURIComponent(rep.downloadUrl), {headers: {'x-planer': '1', 'x-google-auth': 'Bearer ' + token}});
    if (!res.ok) throw new Error('не удалось скачать отчёт (' + res.status + ')');
    const lines = (await res.text()).trim().split(/\r?\n/), head = (lines.shift() || '').split(',');
    const [iDate, iVid, iImp, iCtr] = ['date', 'video_id', 'video_thumbnail_impressions', 'video_thumbnail_impressions_ctr'].map(h => head.indexOf(h));
    if (iVid >= 0 && iImp >= 0) {
      const parsed = lines.map(l => l.split(',')).map(c => ({day: String(c[iDate] || '').replace(/^(\d{4})(\d{2})(\d{2})$/, '$1-$2-$3'), vid: c[iVid], impr: Number(c[iImp]) || 0, ctr: Number(c[iCtr]) || 0}));
      const scale = parsed.some(p => p.ctr > 1) ? 100 : 1; // CTR может прийти долей или процентом
      const byDay = {};
      for (const p of parsed) {
        const d = byDay[p.day] ||= {}, [impr, ctr] = d[p.vid] || [0, 0], total = impr + p.impr;
        d[p.vid] = [total, total ? (impr * ctr + p.impr * p.ctr / scale) / total : 0];
      }
      for (const [day, vids] of Object.entries(byDay)) {
        if ((reach.created[day] || '') <= (rep.createTime || '')) { reach.days[day] = vids; reach.created[day] = rep.createTime || ''; }
      }
    }
    done.add(rep.id);
  }
  const cut = isoPlus(todayIso(), -400);
  for (const day of Object.keys(reach.days)) if (day < cut) { delete reach.days[day]; delete reach.created[day]; }
  reach.done = [...done].slice(-800);
  reach.fetchedAt = Date.now();
  return todo.length;
}

function reachFor(days) {
  const out = {impr: 0, clicks: 0, ctr: 0, videos: {}}, from = isoPlus(todayIso(), -days);
  for (const [day, vids] of Object.entries(state.reach?.days || {})) {
    if (day < from) continue;
    for (const [id, [impr, ctr]] of Object.entries(vids)) {
      const o = out.videos[id] ||= {impr: 0, clicks: 0};
      o.impr += impr; o.clicks += impr * ctr;
      out.impr += impr; out.clicks += impr * ctr;
    }
  }
  out.ctr = out.impr ? out.clicks / out.impr : 0;
  for (const o of Object.values(out.videos)) o.ctr = o.impr ? o.clicks / o.impr : 0;
  return out;
}

function niceTop(max) {
  if (max <= 0) return {top: 1, steps: 4};
  const p = Math.pow(10, Math.floor(Math.log10(max))), n = max / p, k = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
  return {top: k * p, steps: k === 5 ? 5 : 4};
}
function chartFrame(el, values, tick = compact) {
  const W = Math.max(320, el.clientWidth), H = 220, L = 52, R = 12, T = 12, B = 26, {top, steps} = niceTop(Math.max(...values));
  const y = v => T + (H - T - B) * (1 - v / top);
  let grid = '';
  for (let s = 0; s <= steps; s++) {
    const v = top * s / steps;
    grid += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${tick(v)}</text>`;
  }
  return {W, H, L, R, T, B, y, grid};
}

// opts: строка-единица («просмотров») или {unit, aria, tick(v), tip(point) → [значение, подпись]}
function lineChart(el, pts, opts) {
  const o = typeof opts === 'string' ? {unit: opts} : {...opts};
  o.tip ||= p => [fullNum(p.y), `${o.unit} · ${p.label}`];
  const {W, H, L, R, T, B, y, grid} = chartFrame(el, pts.map(p => p.y), o.tick);
  const step = (W - L - R) / Math.max(1, pts.length - 1), x = i => L + i * step;
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join('');
  const every = Math.ceil(pts.length / 7);
  const labels = pts.map((p, i) => (i % every === 0 && pts.length - 1 - i >= every / 2) || i === pts.length - 1
    ? `<text class="ax" x="${x(i)}" y="${H - 6}" text-anchor="${i === pts.length - 1 ? 'end' : i ? 'middle' : 'start'}">${esc(p.label)}</text>` : '').join('');
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria || 'График')}">${grid}${labels}
    <path d="${line}L${x(pts.length - 1)},${y(0)}L${x(0)},${y(0)}Z" fill="#3987e5" fill-opacity=".1"/>
    <path d="${line}" fill="none" stroke="#3987e5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <line class="cross" y1="${T}" y2="${H - B}" visibility="hidden"/>
    <circle r="4" fill="#3987e5" stroke="#212121" stroke-width="2" visibility="hidden"/>
    <rect x="${L}" y="0" width="${W - L - R}" height="${H - B}" fill="transparent"/></svg><div class="tip" hidden></div>`;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), cross = svg.querySelector('.cross'), dot = svg.querySelector('circle');
  svg.addEventListener('pointermove', ev => {
    const i = Math.max(0, Math.min(pts.length - 1, Math.round((ev.clientX - svg.getBoundingClientRect().left - L) / step)));
    cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.setAttribute('visibility', 'visible');
    dot.setAttribute('cx', x(i)); dot.setAttribute('cy', y(pts[i].y)); dot.setAttribute('visibility', 'visible');
    tip.replaceChildren(...o.tip(pts[i]).map((text, k) => mk(k ? 'span' : 'b', text)));
    tip.style.left = Math.min(Math.max(x(i), 70), W - 70) + 'px';
    tip.style.top = y(pts[i].y) + 'px';
    tip.hidden = false;
  });
  svg.addEventListener('pointerleave', () => { tip.hidden = true; cross.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); });
}

function barChart(el, bars, unit) {
  const {W, H, L, R, T, B, y, grid} = chartFrame(el, bars.map(b => b.y));
  const band = (W - L - R) / bars.length, bw = Math.min(24, Math.max(2, band - 2)), base = y(0);
  const marks = bars.map((b, i) => {
    const x0 = L + i * band + (band - bw) / 2, y0 = y(b.y), r = Math.min(4, bw / 2, base - y0);
    const d = base - y0 <= 0 ? '' : `M${x0},${base}V${y0 + r}Q${x0},${y0} ${x0 + r},${y0}H${x0 + bw - r}Q${x0 + bw},${y0} ${x0 + bw},${y0 + r}V${base}Z`;
    return `<path class="bar" data-i="${i}" d="${d}"/><rect data-i="${i}" data-act="anvideo" data-id="${b.id}" x="${L + i * band}" y="0" width="${band}" height="${H - B}" fill="transparent" style="cursor:pointer"/>`;
  }).join('');
  const labels = `<text class="ax" x="${L}" y="${H - 6}">${esc(bars[0].short)}</text><text class="ax" x="${W - R}" y="${H - 6}" text-anchor="end">${esc(bars[bars.length - 1].short)}</text>`;
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Просмотры видео">${grid}${labels}${marks}</svg><div class="tip" hidden></div>`;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip');
  svg.addEventListener('pointermove', ev => {
    const i = ev.target.dataset?.i;
    svg.querySelectorAll('.bar.hover').forEach(p => p.classList.remove('hover'));
    if (i == null) { tip.hidden = true; return; }
    const b = bars[i];
    svg.querySelector(`.bar[data-i="${i}"]`).classList.add('hover');
    tip.replaceChildren(mk('b', `${fullNum(b.y)} ${unit}`), mk('span', b.label.length > 60 ? b.label.slice(0, 58) + '…' : b.label), mk('div', b.date));
    tip.lastChild.style.color = 'var(--text2)';
    tip.style.left = Math.min(Math.max(L + i * band + band / 2, 90), W - 90) + 'px';
    tip.style.top = y(b.y) + 'px';
    tip.hidden = false;
  });
  svg.addEventListener('pointerleave', () => { tip.hidden = true; svg.querySelectorAll('.bar.hover').forEach(p => p.classList.remove('hover')); });
}

const autoLoaded = new Set(); // чтобы при ошибке не запрашивать статистику по кругу

async function fetchVideoAnalytics(v, days) {
  const end = isoPlus(todayIso(), -1), start = isoPlus(end, -(days - 1));
  const q = p => 'https://youtubeanalytics.googleapis.com/v2/reports?' +
    new URLSearchParams({ids: 'channel==MINE', startDate: start, endDate: end, filters: 'video==' + v.yt.id, ...p});
  const [totals, daily, retention, traffic] = await Promise.allSettled([
    gGet(q({metrics: 'views,estimatedMinutesWatched,averageViewDuration,averageViewPercentage,subscribersGained,likes,comments,shares'})),
    gGet(q({metrics: 'views,estimatedMinutesWatched,subscribersGained', dimensions: 'day', sort: 'day'})),
    gGet(q({metrics: 'audienceWatchRatio', dimensions: 'elapsedVideoTimeRatio'})),
    gGet(q({metrics: 'views', dimensions: 'insightTrafficSourceType', sort: '-views'}))
  ]);
  if (totals.status === 'rejected' && daily.status === 'rejected') throw totals.reason;
  const rowsOf = r => r.status === 'fulfilled' ? tableRowsOf(r.value) : [];
  v.ytAnalytics = {days, start, end, fetchedAt: Date.now(), totals: rowsOf(totals)[0] || null,
    daily: rowsOf(daily).map(r => ({day: r.day, views: r.views, minutes: r.estimatedMinutesWatched, subs: r.subscribersGained})),
    retention: rowsOf(retention).map(r => [r.elapsedVideoTimeRatio, r.audienceWatchRatio]).sort((a, b) => a[0] - b[0]),
    traffic: rowsOf(traffic).map(r => [r.insightTrafficSourceType, r.views])};
  return [retention, traffic].filter(r => r.status === 'rejected').length;
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = Object.assign(document.createElement('textarea'), {value: text});
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.append(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    if (!ok) throw new Error('браузер не дал доступ к буферу обмена');
  }
}
// Картинку кладём в буфер как PNG — её можно вставить в чат через Ctrl+V
async function copyImage(src) {
  const bmp = await createImageBitmap(await (await fetch(src)).blob());
  const canvas = Object.assign(document.createElement('canvas'), {width: bmp.width, height: bmp.height});
  canvas.getContext('2d').drawImage(bmp, 0, 0);
  const png = await new Promise(r => canvas.toBlob(r, 'image/png'));
  await navigator.clipboard.write([new ClipboardItem({'image/png': png})]);
}
async function copyForChat(btn, build, hint = '') {
  busy(btn, true, '⏳ Собираю…');

  } catch (e) { toast('Не получилось скопировать: ' + e.message, 6000); }
  finally { busy(btn, false); }
}

async function loadComments(ytId, more) {
  if (!secrets.ytKey || !document.querySelector(`#cmBox[data-yt="${ytId}"]`)) return;
  const order = $('#cmOrder')?.value || 'relevance';
  let cache = commentsCache[ytId];
  if (!cache || cache.order !== order) cache = commentsCache[ytId] = {items: [], next: '', order, loaded: false};
  if ((cache.loaded && !more) || cache.loading) return renderComments(ytId);
  cache.loading = true;
  try {
    const d = await ytGet('commentThreads', {part: 'snippet,replies', videoId: ytId, order, maxResults: 20, textFormat: 'plainText',
      ...(more && cache.next && {pageToken: cache.next})});
    const toComment = s => ({author: s.authorDisplayName, avatar: s.authorProfileImageUrl, text: s.textDisplay, likes: s.likeCount || 0, at: s.publishedAt});
    cache.items.push(...(d.items || []).map(it => ({...toComment(it.snippet.topLevelComment.snippet), replyCount: it.snippet.totalReplyCount || 0,
      replies: (it.replies?.comments || []).map(r => toComment(r.snippet))})));
    cache.next = d.nextPageToken || '';
    cache.loaded = true;
    cache.error = '';
  } catch (e) { cache.error = e.message; }
  cache.loading = false;
  renderComments(ytId);
}

// «Иксы»: во сколько раз просмотров больше медианы канала (видео, Shorts и трансляции считаем отдельно)
const medianCache = new WeakMap();
function kindMedian(c, kind) {
  let m = medianCache.get(c);
  if (!m || m.at !== c.fetchedAt || m.n !== c.videos.length) medianCache.set(c, m = {at: c.fetchedAt, n: c.videos.length});
  if (!(kind in m)) {
    const views = c.videos.filter(o => kindOf(o) === kind && !o.upcoming && !o.onAir).map(o => o.views);
    m[kind] = views.length >= 3 ? median(views) : 0;
  }
  return m[kind];
}
function xOf(c, rv) {
  if (rv.upcoming || rv.onAir) return null;
  const med = kindMedian(c, kindOf(rv));
  return med ? rv.views / med : null;
}
